name: Update GitHub Profile Analytics

on:
  schedule:
    # Run daily at 00:15 UTC
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-analytics
  cancel-in-progress: false

jobs:
  generate:
    name: Generate real GitHub analytics and contribution snake SVGs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate analytics and animated contribution snake SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_analytics.py

      - name: Validate generated SVG files
        run: |
          python3 -c '
          import pathlib, xml.etree.ElementTree as ET
          svgs = sorted(pathlib.Path("assets").rglob("*.svg"))
          assert svgs, "No SVG files found"
          for p in svgs:
              ET.parse(p)
          print(f"Validated {len(svgs)} SVG assets cleanly.")
          '

      - name: Commit and push updated analytics assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/analytics/*.svg
          if git diff --cached --quiet; then
            echo "Analytics assets are already up to date."
          else
            git commit -m "chore(analytics): refresh GitHub statistics and contribution snake"
            git push
          fi
