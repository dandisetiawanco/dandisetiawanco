<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 412" width="920" height="412" role="img" aria-labelledby="eco-t-light eco-d-light">
  <title id="eco-t-light">Engineering Ecosystem Architecture</title>
  <desc id="eco-d-light">Animated five-layer engineering architecture connecting interface, application APIs, AI agent orchestration, data persistence, and systems delivery.</desc>
  <defs>
    <linearGradient id="eco-bg-light" x1="0" y1="0" x2="920" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .v-flow { stroke-dasharray: 5 5; animation: vMove 1.8s linear infinite; }
      .h-flow { stroke-dasharray: 5 5; animation: hMove 2.1s linear infinite; }
      .junc-0 { animation: jPulse 8s ease-in-out 0s infinite; }
      .junc-1 { animation: jPulse 8s ease-in-out 2s infinite; }
      .junc-2 { animation: jPulse 8s ease-in-out 4s infinite; }
      .junc-3 { animation: jPulse 8s ease-in-out 6s infinite; }
    }
    @keyframes vMove {
      from { stroke-dashoffset: 20; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes hMove {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: 20; }
    }
    @keyframes jPulse {
      0%, 24%   { opacity: 1; }
      34%, 100% { opacity: 0.4; }
    }
  </style>
