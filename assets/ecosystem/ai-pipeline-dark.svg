<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220" role="img" aria-labelledby="ai-t-dark ai-d-dark">
  <title id="ai-t-dark">Deterministic Human-in-the-Loop AI Engineering Loop</title>
  <desc id="ai-d-dark">Five-stage agent execution architecture: Intent Parse, Typed Plan, Approval Gate, Sandboxed Run, and Audit Verify with verification feedback.</desc>
  <defs>
    <linearGradient id="ai-bg-dark" x1="0" y1="0" x2="920" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101820" />
      <stop offset="100%" stop-color="#0C131A" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .ai-flow { stroke-dasharray: 6 5; animation: aiDash 1.6s linear infinite; }
      .fb-loop { stroke-dasharray: 8 6; animation: fbDash 3.2s linear infinite; }
      .st-0 { animation: stPulse 10s ease-in-out 0.0s infinite; }
      .st-1 { animation: stPulse 10s ease-in-out 2.0s infinite; }
      .st-2 { animation: stPulse 10s ease-in-out 4.0s infinite; }
      .st-3 { animation: stPulse 10s ease-in-out 6.0s infinite; }
      .st-4 { animation: stPulse 10s ease-in-out 8.0s infinite; }
    }
    @keyframes aiDash {
      from { stroke-dashoffset: 22; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes fbDash {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: 28; }
    }
    @keyframes stPulse {
      0%, 18%   { stroke-width: 2.0; }
      26%, 100% { stroke-width: 1.15; }
    }
  </style>
  <rect x="0.75" y="0.75" width="918.5" height="218.5" rx="14" fill="url(#ai-bg-dark)" stroke="#263646" stroke-width="1.2" />
  <text x="32" y="34" class="sans" font-size="14.5" font-weight="700" fill="#F8FAFC">Deterministic Agent Execution Pattern</text>
  <text x="888" y="34" text-anchor="end" class="mono" font-size="9.8" fill="#C4B5FD">APPLIED IN AGENTOS · OMNIDESK · TALENTOS</text>
  <line x1="32" y1="45" x2="888" y2="45" stroke="#1E2C3A" stroke-width="1" />

  <line class="ai-flow" x1="184.0" y1="99" x2="208.0" y2="99" stroke="#22D3EE" stroke-width="1.8" />
  <line class="ai-flow" x1="360.0" y1="99" x2="384.0" y2="99" stroke="#8B5CF6" stroke-width="1.8" />
  <line class="ai-flow" x1="536.0" y1="99" x2="560.0" y2="99" stroke="#F59E0B" stroke-width="1.8" />
  <line class="ai-flow" x1="712.0" y1="99" x2="736.0" y2="99" stroke="#10B981" stroke-width="1.8" />
  <g>
    <rect class="st-0" x="32.0" y="58" width="152.0" height="82" rx="9" fill="#16212C" stroke="#22D3EE" stroke-width="1.2" />
    <rect x="44.0" y="70" width="24" height="3" rx="1.5" fill="#22D3EE" />
    <text x="44.0" y="90" class="mono" font-size="9.5" font-weight="700" fill="#22D3EE">01</text>
    <text x="44.0" y="110" class="sans" font-size="13.2" font-weight="700" fill="#F8FAFC">Intent Parse</text>
    <text x="44.0" y="127" class="mono" font-size="9.6" fill="#94A3B8">Schema &amp; context</text>
  </g>
  <g>
    <rect class="st-1" x="208.0" y="58" width="152.0" height="82" rx="9" fill="#16212C" stroke="#8B5CF6" stroke-width="1.2" />
    <rect x="220.0" y="70" width="24" height="3" rx="1.5" fill="#8B5CF6" />
    <text x="220.0" y="90" class="mono" font-size="9.5" font-weight="700" fill="#C4B5FD">02</text>
    <text x="220.0" y="110" class="sans" font-size="13.2" font-weight="700" fill="#F8FAFC">Typed Plan</text>
    <text x="220.0" y="127" class="mono" font-size="9.6" fill="#94A3B8">LangGraph DAG</text>
  </g>
  <g>
    <rect class="st-2" x="384.0" y="58" width="152.0" height="82" rx="9" fill="#16212C" stroke="#F59E0B" stroke-width="1.2" />
    <rect x="396.0" y="70" width="24" height="3" rx="1.5" fill="#F59E0B" />
    <text x="396.0" y="90" class="mono" font-size="9.5" font-weight="700" fill="#FBBF24">03</text>
    <text x="396.0" y="110" class="sans" font-size="13.2" font-weight="700" fill="#F8FAFC">Approval Gate</text>
    <text x="396.0" y="127" class="mono" font-size="9.6" fill="#94A3B8">Scoped consent</text>
  </g>
  <g>
    <rect class="st-3" x="560.0" y="58" width="152.0" height="82" rx="9" fill="#16212C" stroke="#10B981" stroke-width="1.2" />
    <rect x="572.0" y="70" width="24" height="3" rx="1.5" fill="#10B981" />
    <text x="572.0" y="90" class="mono" font-size="9.5" font-weight="700" fill="#34D399">04</text>
    <text x="572.0" y="110" class="sans" font-size="13.2" font-weight="700" fill="#F8FAFC">Sandboxed Run</text>
    <text x="572.0" y="127" class="mono" font-size="9.6" fill="#94A3B8">Loopback IPC</text>
  </g>
  <g>
    <rect class="st-4" x="736.0" y="58" width="152.0" height="82" rx="9" fill="#16212C" stroke="#10B981" stroke-width="1.2" />
    <rect x="748.0" y="70" width="24" height="3" rx="1.5" fill="#10B981" />
    <text x="748.0" y="90" class="mono" font-size="9.5" font-weight="700" fill="#34D399">05</text>
    <text x="748.0" y="110" class="sans" font-size="13.2" font-weight="700" fill="#F8FAFC">Audit Verify</text>
    <text x="748.0" y="127" class="mono" font-size="9.6" fill="#94A3B8">Exit &amp; SQLite log</text>
  </g>

  <!-- Verification feedback arc looping back from Verify (stage 5) to Typed Plan (stage 2) -->
  <path d="M 812 140 L 812 178 C 812 184 806 188 800 188 L 296 188 C 290 188 284 184 284 178 L 284 140" fill="none" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5" />
  <path class="fb-loop" d="M 812 140 L 812 178 C 812 184 806 188 800 188 L 296 188 C 290 188 284 184 284 178 L 284 140" fill="none" stroke="#8B5CF6" stroke-width="1.5" />
  <rect x="444" y="177" width="208" height="22" rx="5" fill="#16212C" stroke="#263646" stroke-width="1" />
  <text x="548" y="191.5" text-anchor="middle" class="mono" font-size="9.4" font-weight="600" fill="#C4B5FD">VERIFICATION FEEDBACK LOOP</text>
</svg>
