<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 332" width="440" height="332" role="img" aria-labelledby="ss-tl ss-dl">
  <title id="ss-tl">Systems Stack: AI, Desktop, Databases, and Infrastructure</title>
  <desc id="ss-dl">Light-mode animated visual engineering showcase of AI orchestration, desktop runtimes, databases, and DevOps infrastructure.</desc>
  <defs>
    <linearGradient id="ss-bg-l" x1="0" y1="0" x2="440" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F6FAF8" />
    </linearGradient>
    <clipPath id="ss-clip-l">
      <rect x="0.75" y="0.75" width="438.5" height="330.5" rx="12" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .chip { fill: #F8FBFA; stroke: #D5E2DD; stroke-width: 1; }
    .lbl  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #0F1715; }

    @media (prefers-reduced-motion: no-preference) {
      .bar-4 { animation: focusB4 10s ease-in-out infinite; }
      .bar-5 { animation: focusB5 10s ease-in-out infinite; }
      .bar-6 { animation: focusB6 10s ease-in-out infinite; }
      .bar-7 { animation: focusB7 10s ease-in-out infinite; }
      .c4-hi { animation: chipB4 10s ease-in-out infinite; }
      .c5-hi { animation: chipB5 10s ease-in-out infinite; }
      .c6-hi { animation: chipB6 10s ease-in-out infinite; }
      .c7-hi { animation: chipB7 10s ease-in-out infinite; }
    }
    @keyframes focusB4 {
      0%, 22%  { fill: #059669; width: 42px; }
      27%, 100%{ fill: #CBD8D3; width: 16px; }
    }
    @keyframes focusB5 {
      0%, 24%  { fill: #CBD8D3; width: 16px; }
      28%, 48% { fill: #059669; width: 42px; }
      53%, 100%{ fill: #CBD8D3; width: 16px; }
    }
    @keyframes focusB6 {
      0%, 49%  { fill: #CBD8D3; width: 16px; }
      53%, 73% { fill: #059669; width: 42px; }
      78%, 100%{ fill: #CBD8D3; width: 16px; }
    }
    @keyframes focusB7 {
      0%, 74%  { fill: #CBD8D3; width: 16px; }
      78%, 97% { fill: #059669; width: 42px; }
      100%     { fill: #CBD8D3; width: 16px; }
    }
    @keyframes chipB4 {
      0%, 22%  { stroke: #6EE7B7; fill: #ECFDF5; }
      27%, 100%{ stroke: #D5E2DD; fill: #F8FBFA; }
    }
    @keyframes chipB5 {
      0%, 24%  { stroke: #D5E2DD; fill: #F8FBFA; }
      28%, 48% { stroke: #6EE7B7; fill: #ECFDF5; }
      53%, 100%{ stroke: #D5E2DD; fill: #F8FBFA; }
    }
    @keyframes chipB6 {
      0%, 49%  { stroke: #D5E2DD; fill: #F8FBFA; }
      53%, 73% { stroke: #6EE7B7; fill: #ECFDF5; }
      78%, 100%{ stroke: #D5E2DD; fill: #F8FBFA; }
    }
    @keyframes chipB7 {
      0%, 74%  { stroke: #D5E2DD; fill: #F8FBFA; }
      78%, 97% { stroke: #6EE7B7; fill: #ECFDF5; }
      100%     { stroke: #D5E2DD; fill: #F8FBFA; }
    }
  </style>

  <g clip-path="url(#ss-clip-l)">
    <rect x="0" y="0" width="440" height="332" fill="url(#ss-bg-l)" />

    <g>
      <rect class="bar-4" x="20" y="22" width="42" height="2.5" rx="1.2" fill="#059669" />
      <text x="20" y="40" class="mono" font-size="10.5" font-weight="600" fill="#566560">04 · AI &amp; AUTOMATION</text>

      <rect class="chip c4-hi" x="20" y="50" width="128" height="28" rx="6" />
      <circle cx="32" cy="60" r="2.2" fill="#059669" />
      <circle cx="40" cy="60" r="2.2" fill="#059669" />
      <circle cx="36" cy="68" r="2.2" fill="#047857" />
      <path d="M 32 60 L 40 60 L 36 68 Z" fill="none" stroke="#059669" stroke-width="1.1" />
      <text x="48" y="68" class="lbl">LangGraph</text>

      <rect class="chip c4-hi" x="156" y="50" width="128" height="28" rx="6" />
      <rect x="166" y="58" width="12" height="12" rx="3" fill="none" stroke="#059669" stroke-width="1.2" />
      <circle cx="172" cy="64" r="2" fill="#059669" />
      <text x="185" y="68" class="lbl">LLM Agents</text>

      <rect class="chip" x="292" y="50" width="128" height="28" rx="6" />
      <circle cx="306" cy="65" r="5" fill="none" stroke="#475569" stroke-width="1.2" />
      <circle cx="311" cy="61" r="2" fill="#059669" />
      <text x="319" y="68" class="lbl">Scikit-learn</text>
    </g>

    <line x1="20" y1="90" x2="420" y2="90" stroke="#E2ECE8" stroke-width="1" />

    <g>
      <rect class="bar-5" x="20" y="102" width="16" height="2.5" rx="1.2" fill="#CBD8D3" />
      <text x="20" y="120" class="mono" font-size="10.5" font-weight="600" fill="#566560">05 · DESKTOP DEVELOPMENT</text>

      <rect class="chip c5-hi" x="20" y="130" width="196" height="28" rx="6" />
      <circle cx="35" cy="144" r="4.8" fill="none" stroke="#059669" stroke-width="1.3" />
      <circle cx="40" cy="144" r="4.8" fill="none" stroke="#334155" stroke-width="1.3" />
      <text x="52" y="148" class="lbl">Tauri 2 Native Shell</text>

      <rect class="chip c5-hi" x="224" y="130" width="196" height="28" rx="6" />
      <path d="M 235 144 L 247 144 M 238 140 L 234 144 L 238 148 M 244 140 L 248 144 L 244 148" fill="none" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="256" y="148" class="lbl">Local-First IPC Bridge</text>
    </g>

    <line x1="20" y1="170" x2="420" y2="170" stroke="#E2ECE8" stroke-width="1" />

    <g>
      <rect class="bar-6" x="20" y="182" width="16" height="2.5" rx="1.2" fill="#CBD8D3" />
      <text x="20" y="200" class="mono" font-size="10.5" font-weight="600" fill="#566560">06 · DATABASES</text>

      <rect class="chip c6-hi" x="20" y="210" width="128" height="28" rx="6" />
      <ellipse cx="36" cy="220" rx="5.5" ry="2.2" fill="none" stroke="#334155" stroke-width="1.2" />
      <path d="M 30.5 220 L 30.5 227.5 C 30.5 229.5 41.5 229.5 41.5 227.5 L 41.5 220" fill="none" stroke="#334155" stroke-width="1.2" />
      <text x="48" y="228" class="lbl">PostgreSQL</text>

      <rect class="chip c6-hi" x="156" y="210" width="128" height="28" rx="6" />
      <ellipse cx="172" cy="220" rx="5.5" ry="2.2" fill="none" stroke="#059669" stroke-width="1.2" />
      <path d="M 166.5 220 L 166.5 227.5 C 166.5 229.5 177.5 229.5 177.5 227.5 L 177.5 220" fill="none" stroke="#475569" stroke-width="1.2" />
      <text x="186" y="228" class="lbl">MySQL</text>

      <rect class="chip c6-hi" x="292" y="210" width="128" height="28" rx="6" />
      <rect x="302" y="218" width="11" height="12" rx="2" fill="none" stroke="#059669" stroke-width="1.2" />
      <line x1="305" y1="222" x2="310" y2="222" stroke="#059669" stroke-width="1.1" />
      <text x="321" y="228" class="lbl">SQLite</text>
    </g>

    <line x1="20" y1="250" x2="420" y2="250" stroke="#E2ECE8" stroke-width="1" />

    <g>
      <rect class="bar-7" x="20" y="260" width="16" height="2.5" rx="1.2" fill="#CBD8D3" />
      <text x="20" y="276" class="mono" font-size="10.5" font-weight="600" fill="#566560">07 · INFRASTRUCTURE</text>

      <rect class="chip c7-hi" x="20" y="284" width="96" height="28" rx="6" />
      <rect x="29" y="294" width="12" height="7" rx="1.5" fill="none" stroke="#334155" stroke-width="1.2" />
      <rect x="31" y="290" width="3.5" height="3.5" fill="#059669" />
      <rect x="35.5" y="290" width="3.5" height="3.5" fill="#059669" />
      <text x="47" y="302" class="lbl">Docker</text>

      <rect class="chip c7-hi" x="122" y="284" width="96" height="28" rx="6" />
      <circle cx="132" cy="294" r="2" fill="#059669" />
      <circle cx="138" cy="302" r="2" fill="#059669" />
      <path d="M 132 296 L 132 299 C 132 301 135 302 136 302" fill="none" stroke="#059669" stroke-width="1.2" />
      <text x="145" y="302" class="lbl">Actions</text>

      <rect class="chip c7-hi" x="224" y="284" width="94" height="28" rx="6" />
      <polygon points="237,292 243,302 231,302" fill="#0F1715" />
      <text x="249" y="302" class="lbl">Vercel</text>

      <rect class="chip" x="324" y="284" width="96" height="28" rx="6" />
      <rect x="332" y="292" width="11" height="10" rx="2" fill="none" stroke="#475569" stroke-width="1.2" />
      <path d="M 335 295.5 L 337.5 297 L 335 298.5" fill="none" stroke="#059669" stroke-width="1.1" stroke-linecap="round" />
      <text x="349" y="302" class="lbl">Linux</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="438.5" height="330.5" rx="12" fill="none" stroke="#CBD8D3" stroke-width="1.2" />
</svg>
