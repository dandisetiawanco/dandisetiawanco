<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 332" width="440" height="332" role="img" aria-labelledby="sc-tl sc-dl">
  <title id="sc-tl">Core Engineering Stack: Languages, Frontend, and Backend</title>
  <desc id="sc-dl">Light-mode animated visual engineering showcase of verified programming languages, frontend frameworks, and backend technologies.</desc>
  <defs>
    <linearGradient id="sc-bg-l" x1="0" y1="0" x2="440" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F6FAF8" />
    </linearGradient>
    <clipPath id="sc-clip-l">
      <rect x="0.75" y="0.75" width="438.5" height="330.5" rx="12" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .chip { fill: #F8FBFA; stroke: #D5E2DD; stroke-width: 1; }
    .lbl  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #0F1715; }

    @media (prefers-reduced-motion: no-preference) {
      .bar-1 { animation: focusBar1 9s ease-in-out infinite; }
      .bar-2 { animation: focusBar2 9s ease-in-out infinite; }
      .bar-3 { animation: focusBar3 9s ease-in-out infinite; }
      .c1-hi { animation: chipHi1 9s ease-in-out infinite; }
      .c2-hi { animation: chipHi2 9s ease-in-out infinite; }
      .c3-hi { animation: chipHi3 9s ease-in-out infinite; }
    }
    @keyframes focusBar1 {
      0%, 28%  { fill: #059669; width: 42px; }
      34%, 100%{ fill: #CBD8D3; width: 16px; }
    }
    @keyframes focusBar2 {
      0%, 30%  { fill: #CBD8D3; width: 16px; }
      35%, 62% { fill: #059669; width: 42px; }
      68%, 100%{ fill: #CBD8D3; width: 16px; }
    }
    @keyframes focusBar3 {
      0%, 64%  { fill: #CBD8D3; width: 16px; }
      69%, 96% { fill: #059669; width: 42px; }
      100%     { fill: #CBD8D3; width: 16px; }
    }
    @keyframes chipHi1 {
      0%, 28%  { stroke: #6EE7B7; fill: #ECFDF5; }
      34%, 100%{ stroke: #D5E2DD; fill: #F8FBFA; }
    }
    @keyframes chipHi2 {
      0%, 30%  { stroke: #D5E2DD; fill: #F8FBFA; }
      35%, 62% { stroke: #6EE7B7; fill: #ECFDF5; }
      68%, 100%{ stroke: #D5E2DD; fill: #F8FBFA; }
    }
    @keyframes chipHi3 {
      0%, 64%  { stroke: #D5E2DD; fill: #F8FBFA; }
      69%, 96% { stroke: #6EE7B7; fill: #ECFDF5; }
      100%     { stroke: #D5E2DD; fill: #F8FBFA; }
    }
  </style>

  <g clip-path="url(#sc-clip-l)">
    <rect x="0" y="0" width="440" height="332" fill="url(#sc-bg-l)" />

    <g>
      <rect class="bar-1" x="20" y="22" width="42" height="2.5" rx="1.2" fill="#059669" />
      <text x="20" y="40" class="mono" font-size="10.5" font-weight="600" fill="#566560">01 · LANGUAGES</text>

      <rect class="chip c1-hi" x="20" y="50" width="128" height="28" rx="6" />
      <path d="M 32 59 C 32 57 38 57 38 59 L 38 63 L 34 63 C 32 63 32 67 34 67 L 40 67 C 40 69 34 69 34 67" fill="none" stroke="#059669" stroke-width="1.35" stroke-linecap="round" />
      <circle cx="35" cy="58.5" r="0.8" fill="#0F1715" />
      <text x="47" y="68" class="lbl">Python</text>

      <rect class="chip c1-hi" x="156" y="50" width="128" height="28" rx="6" />
      <rect x="165" y="57" width="14" height="14" rx="2.5" fill="#ECFDF5" stroke="#059669" stroke-width="1" />
      <text x="172" y="67" text-anchor="middle" class="mono" font-size="7.8" font-weight="700" fill="#065F46">TS</text>
      <text x="186" y="68" class="lbl">TypeScript</text>

      <rect class="chip" x="292" y="50" width="128" height="28" rx="6" />
      <rect x="301" y="57" width="14" height="14" rx="2.5" fill="#F1F5F9" stroke="#64748B" stroke-width="1" />
      <text x="308" y="67" text-anchor="middle" class="mono" font-size="7.8" font-weight="700" fill="#0F172A">JS</text>
      <text x="322" y="68" class="lbl">JavaScript</text>

      <rect class="chip" x="20" y="84" width="128" height="28" rx="6" />
      <ellipse cx="36" cy="98" rx="8" ry="5.5" fill="none" stroke="#475569" stroke-width="1.25" />
      <text x="36" y="100.5" text-anchor="middle" class="mono" font-size="6.5" font-weight="700" fill="#1E293B">php</text>
      <text x="50" y="102" class="lbl">PHP 8.4</text>

      <rect class="chip c1-hi" x="156" y="84" width="128" height="28" rx="6" />
      <circle cx="172" cy="98" r="5.8" fill="none" stroke="#059669" stroke-width="1.35" stroke-dasharray="2.5 1.5" />
      <text x="172" y="101" text-anchor="middle" class="mono" font-size="7.5" font-weight="700" fill="#0F1715">R</text>
      <text x="186" y="102" class="lbl">Rust</text>

      <rect class="chip" x="292" y="84" width="128" height="28" rx="6" />
      <ellipse cx="308" cy="94.5" rx="5.5" ry="2.2" fill="none" stroke="#475569" stroke-width="1.2" />
      <path d="M 302.5 94.5 L 302.5 101.5 C 302.5 103 313.5 103 313.5 101.5 L 313.5 94.5" fill="none" stroke="#475569" stroke-width="1.2" />
      <text x="322" y="102" class="lbl">SQL</text>
    </g>

    <line x1="20" y1="124" x2="420" y2="124" stroke="#E2ECE8" stroke-width="1" />

    <g>
      <rect class="bar-2" x="20" y="136" width="16" height="2.5" rx="1.2" fill="#CBD8D3" />
      <text x="20" y="154" class="mono" font-size="10.5" font-weight="600" fill="#566560">02 · FRONTEND</text>

      <rect class="chip c2-hi" x="20" y="164" width="128" height="28" rx="6" />
      <ellipse cx="36" cy="178" rx="6.5" ry="2.6" fill="none" stroke="#059669" stroke-width="1.1" transform="rotate(30 36 178)" />
      <ellipse cx="36" cy="178" rx="6.5" ry="2.6" fill="none" stroke="#059669" stroke-width="1.1" transform="rotate(-30 36 178)" />
      <circle cx="36" cy="178" r="1.3" fill="#059669" />
      <text x="48" y="182" class="lbl">React 19</text>

      <rect class="chip c2-hi" x="156" y="164" width="128" height="28" rx="6" />
      <circle cx="172" cy="178" r="6.2" fill="none" stroke="#0F172A" stroke-width="1.2" />
      <path d="M 169.5 181.5 L 169.5 174.5 L 175 182" fill="none" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round" />
      <text x="186" y="182" class="lbl">Next.js</text>

      <rect class="chip c2-hi" x="292" y="164" width="128" height="28" rx="6" />
      <path d="M 301 176.5 C 303 173.5 306 173.5 308 176.5 C 310 179.5 313 179.5 315 176.5 M 301 180.5 C 303 177.5 306 177.5 308 180.5 C 310 183.5 313 183.5 315 180.5" fill="none" stroke="#059669" stroke-width="1.3" stroke-linecap="round" />
      <text x="322" y="182" class="lbl">Tailwind</text>

      <rect class="chip" x="20" y="198" width="128" height="28" rx="6" />
      <polygon points="36,192 31,200 35,200 34,205 41,197 37,197" transform="translate(0 13)" fill="none" stroke="#334155" stroke-width="1.2" stroke-linejoin="round" />
      <text x="48" y="216" class="lbl">Vite</text>

      <rect class="chip" x="156" y="198" width="128" height="28" rx="6" />
      <circle cx="172" cy="212" r="5.5" fill="none" stroke="#475569" stroke-width="1.2" />
      <circle cx="172" cy="212" r="2" fill="#059669" />
      <text x="185" y="216" class="lbl">TanStack</text>

      <rect class="chip" x="292" y="198" width="128" height="28" rx="6" />
      <path d="M 303 207 L 313 207 L 308 212 L 313 217 L 303 217 Z" fill="none" stroke="#334155" stroke-width="1.15" stroke-linejoin="round" />
      <text x="321" y="216" class="lbl">Motion</text>
    </g>

    <line x1="20" y1="238" x2="420" y2="238" stroke="#E2ECE8" stroke-width="1" />

    <g>
      <rect class="bar-3" x="20" y="250" width="16" height="2.5" rx="1.2" fill="#CBD8D3" />
      <text x="20" y="268" class="mono" font-size="10.5" font-weight="600" fill="#566560">03 · BACKEND</text>

      <rect class="chip c3-hi" x="20" y="278" width="96" height="28" rx="6" />
      <circle cx="33" cy="292" r="5.5" fill="none" stroke="#059669" stroke-width="1.25" />
      <path d="M 34 288.5 L 31 292.5 L 34 292.5 L 32 295.5" fill="none" stroke="#047857" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="44" y="296" class="lbl">FastAPI</text>

      <rect class="chip c3-hi" x="122" y="278" width="96" height="28" rx="6" />
      <polygon points="135,286.5 140.5,289.5 140.5,295.5 135,298.5 129.5,295.5 129.5,289.5" fill="none" stroke="#334155" stroke-width="1.2" />
      <text x="146" y="296" class="lbl">Laravel</text>

      <rect class="chip" x="224" y="278" width="94" height="28" rx="6" />
      <rect x="231" y="285" width="13" height="13" rx="2.5" fill="#ECFDF5" stroke="#059669" stroke-width="1" />
      <text x="237.5" y="294.5" text-anchor="middle" class="mono" font-size="7.5" font-weight="700" fill="#065F46">dj</text>
      <text x="249" y="296" class="lbl">Django</text>

      <rect class="chip c3-hi" x="324" y="278" width="96" height="28" rx="6" />
      <polygon points="337,286.5 342,289.5 342,295.5 337,298.5 332,295.5 332,289.5" fill="none" stroke="#059669" stroke-width="1.25" />
      <text x="348" y="296" class="lbl">Node.js</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="438.5" height="330.5" rx="12" fill="none" stroke="#CBD8D3" stroke-width="1.2" />
</svg>
