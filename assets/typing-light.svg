<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 44" width="760" height="44" role="img" aria-labelledby="typing-title-l typing-desc-l">
  <title id="typing-title-l">Professional Introduction: Full Stack Software Engineer, Artificial Intelligence &amp; Automation, Founder of NGOPREK DIGITAL, Connect. Collaborate. Create.</title>
  <desc id="typing-desc-l">Centered typing animation cycling smoothly through four professional identity statements in light mode.</desc>
  <defs>
    <clipPath id="clip-1-l"><rect class="reveal-1" x="-40" y="4" width="280" height="36" /></clipPath>
    <clipPath id="clip-2-l"><rect class="reveal-2" x="-160" y="4" width="360" height="36" /></clipPath>
    <clipPath id="clip-3-l"><rect class="reveal-3" x="-10" y="4" width="260" height="36" /></clipPath>
    <clipPath id="clip-4-l"><rect class="reveal-4" x="-55" y="4" width="290" height="36" /></clipPath>
  </defs>

  <style>
    .line-text {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      font-weight: 600;
      fill: #046C4E;
    }
    .cursor {
      fill: #166270;
      rx: 1.2;
    }

    .g-1 { opacity: 1; }
    .g-2, .g-3, .g-4 { opacity: 0; }
    .reveal-1 { transform: translateX(280px); }
    .cur-1 { transform: translateX(522px); opacity: 1; }
    .cur-2, .cur-3, .cur-4 { opacity: 0; }

    @media (prefers-reduced-motion: no-preference) {
      .g-1 { animation: vis1 16s linear infinite; }
      .g-2 { animation: vis2 16s linear infinite; }
      .g-3 { animation: vis3 16s linear infinite; }
      .g-4 { animation: vis4 16s linear infinite; }

      .reveal-1 { animation: rev1 16s steps(28, end) infinite; }
      .reveal-2 { animation: rev2 16s steps(36, end) infinite; }
      .reveal-3 { animation: rev3 16s steps(26, end) infinite; }
      .reveal-4 { animation: rev4 16s steps(29, end) infinite; }

      .cur-1 { animation: cpos1 16s steps(28, end) infinite, cvis1 16s linear infinite; }
      .cur-2 { animation: cpos2 16s steps(36, end) infinite, cvis2 16s linear infinite; }
      .cur-3 { animation: cpos3 16s steps(26, end) infinite, cvis3 16s linear infinite; }
      .cur-4 { animation: cpos4 16s steps(29, end) infinite, cvis4 16s linear infinite; }
    }

    @keyframes vis1 {
      0%, 23.8% { opacity: 1; }
      24.2%, 100% { opacity: 0; }
    }
    @keyframes vis2 {
      0%, 24.8% { opacity: 0; }
      25%, 48.8% { opacity: 1; }
      49.2%, 100% { opacity: 0; }
    }
    @keyframes vis3 {
      0%, 49.8% { opacity: 0; }
      50%, 73.8% { opacity: 1; }
      74.2%, 100% { opacity: 0; }
    }
    @keyframes vis4 {
      0%, 74.8% { opacity: 0; }
      75%, 98.8% { opacity: 1; }
      99.2%, 100% { opacity: 0; }
    }

    @keyframes rev1 {
      0% { transform: translateX(0px); }
      7.5%, 19.5% { transform: translateX(280px); }
      23.5%, 100% { transform: translateX(0px); }
    }
    @keyframes cpos1 {
      0% { transform: translateX(242px); }
      7.5%, 19.5% { transform: translateX(522px); }
      23.5%, 100% { transform: translateX(242px); }
    }
    @keyframes cvis1 {
      0%, 9% { opacity: 1; }
      11% { opacity: 0.2; }
      13% { opacity: 1; }
      15% { opacity: 0.2; }
      17%, 23.6% { opacity: 1; }
      24%, 100% { opacity: 0; }
    }

    @keyframes rev2 {
      0%, 25% { transform: translateX(0px); }
      33%, 44.5% { transform: translateX(360px); }
      48.5%, 100% { transform: translateX(0px); }
    }
    @keyframes cpos2 {
      0%, 25% { transform: translateX(202px); }
      33%, 44.5% { transform: translateX(562px); }
      48.5%, 100% { transform: translateX(202px); }
    }
    @keyframes cvis2 {
      0%, 24.8% { opacity: 0; }
      25%, 34.5% { opacity: 1; }
      36.5% { opacity: 0.2; }
      38.5% { opacity: 1; }
      40.5% { opacity: 0.2; }
      42.5%, 48.6% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @keyframes rev3 {
      0%, 50% { transform: translateX(0px); }
      57.5%, 69.5% { transform: translateX(260px); }
      73.5%, 100% { transform: translateX(0px); }
    }
    @keyframes cpos3 {
      0%, 50% { transform: translateX(252px); }
      57.5%, 69.5% { transform: translateX(512px); }
      73.5%, 100% { transform: translateX(252px); }
    }
    @keyframes cvis3 {
      0%, 49.8% { opacity: 0; }
      50%, 59% { opacity: 1; }
      61% { opacity: 0.2; }
      63% { opacity: 1; }
      65% { opacity: 0.2; }
      67%, 73.6% { opacity: 1; }
      74%, 100% { opacity: 0; }
    }

    @keyframes rev4 {
      0%, 75% { transform: translateX(0px); }
      82.5%, 94.5% { transform: translateX(290px); }
      98.5%, 100% { transform: translateX(0px); }
    }
    @keyframes cpos4 {
      0%, 75% { transform: translateX(237px); }
      82.5%, 94.5% { transform: translateX(527px); }
      98.5%, 100% { transform: translateX(237px); }
    }
    @keyframes cvis4 {
      0%, 74.8% { opacity: 0; }
      75%, 84% { opacity: 1; }
      86% { opacity: 0.2; }
      88% { opacity: 1; }
      90% { opacity: 0.2; }
      92%, 98.6% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
  </style>

  <line x1="150" y1="22" x2="178" y2="22" stroke="#83BCA8" stroke-width="1.35" />
  <line x1="582" y1="22" x2="610" y2="22" stroke="#83BCA8" stroke-width="1.35" />

  <g class="g-1" clip-path="url(#clip-1-l)">
    <text x="240" y="27" textLength="280" lengthAdjust="spacing" class="line-text">Full Stack Software Engineer</text>
  </g>
  <rect class="cursor cur-1" x="0" y="12" width="2.2" height="20" />

  <g class="g-2" clip-path="url(#clip-2-l)">
    <text x="200" y="27" textLength="360" lengthAdjust="spacing" class="line-text">Artificial Intelligence &amp; Automation</text>
  </g>
  <rect class="cursor cur-2" x="0" y="12" width="2.2" height="20" />

  <g class="g-3" clip-path="url(#clip-3-l)">
    <text x="250" y="27" textLength="260" lengthAdjust="spacing" class="line-text">Founder of NGOPREK DIGITAL</text>
  </g>
  <rect class="cursor cur-3" x="0" y="12" width="2.2" height="20" />

  <g class="g-4" clip-path="url(#clip-4-l)">
    <text x="235" y="27" textLength="290" lengthAdjust="spacing" class="line-text">Connect. Collaborate. Create.</text>
  </g>
  <rect class="cursor cur-4" x="0" y="12" width="2.2" height="20" />
</svg>
