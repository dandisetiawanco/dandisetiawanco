<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="hero-title-l hero-desc-l">
  <title id="hero-title-l">Dandi Setiawan, Full Stack Software Engineer, Artificial Intelligence Developer, Founder of NGOPREK DIGITAL</title>
  <desc id="hero-desc-l">Animated architectural emerald and mint banner introducing Dandi Setiawan with subtle geometric circuit data streams for light mode.</desc>
  <defs>
    <linearGradient id="bg-grad-l" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7FAF9" />
      <stop offset="56%" stop-color="#F1F8F5" />
      <stop offset="100%" stop-color="#E5F3EF" />
    </linearGradient>
    <radialGradient id="core-glow-l" cx="792" cy="116" r="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#83BCA8" stop-opacity="0.28" />
      <stop offset="58%" stop-color="#2996A8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F7FAF9" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="top-sweep-l" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#057A55" stop-opacity="0" />
      <stop offset="50%" stop-color="#057A55" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#057A55" stop-opacity="0" />
    </linearGradient>
    <clipPath id="card-clip-l">
      <rect x="1" y="1" width="998" height="258" rx="16" />
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    .serif-italic {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }
    .mono {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    .trace-base {
      fill: none;
      stroke: #C4DCD5;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .trace-flow {
      fill: none;
      stroke: #057A55;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .trace-flow-teal {
      fill: none;
      stroke: #1B6F7E;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (prefers-reduced-motion: no-preference) {
      .enter-1 { animation: fadeSlide 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both; }
      .enter-2 { animation: fadeSlide 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.16s both; }
      .enter-3 { animation: fadeSlide 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both; }
      .enter-4 { animation: fadeSlide 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.40s both; }

      .flow-a { stroke-dasharray: 52 340; animation: dashA 5.6s linear infinite; }
      .flow-b { stroke-dasharray: 44 316; animation: dashB 6.8s linear infinite; }
      .flow-c { stroke-dasharray: 38 282; animation: dashC 4.9s linear infinite; }
      .flow-d { stroke-dasharray: 46 314; animation: dashD 6.2s linear infinite; }
      .flow-e { stroke-dasharray: 34 246; animation: dashE 7.4s linear infinite; }

      .ring-cw { transform-origin: 792px 116px; animation: spinCW 32s linear infinite; }
      .ring-ccw { transform-origin: 792px 116px; animation: spinCCW 44s linear infinite; }
      .pulse-1 { animation: nodePulse 3.6s ease-in-out infinite; }
      .pulse-2 { animation: nodePulse 4.4s ease-in-out 1.2s infinite; }
      .pulse-3 { animation: nodePulse 5.0s ease-in-out 2.1s infinite; }
      .sweep-bar { animation: sweepX 8.5s ease-in-out infinite; }
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes dashA { from { stroke-dashoffset: 392; } to { stroke-dashoffset: 0; } }
    @keyframes dashB { from { stroke-dashoffset: 360; } to { stroke-dashoffset: 0; } }
    @keyframes dashC { from { stroke-dashoffset: 320; } to { stroke-dashoffset: 0; } }
    @keyframes dashD { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 360; } }
    @keyframes dashE { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 280; } }
    @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes nodePulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes sweepX {
      0% { transform: translateX(-280px); opacity: 0; }
      12% { opacity: 0.8; }
      88% { opacity: 0.8; }
      100% { transform: translateX(1020px); opacity: 0; }
    }
  </style>

  <g clip-path="url(#card-clip-l)">
    <rect x="0" y="0" width="1000" height="260" fill="url(#bg-grad-l)" />
    <rect x="0" y="0" width="1000" height="260" fill="url(#core-glow-l)" />
    <rect class="sweep-bar" x="0" y="1" width="260" height="2" fill="url(#top-sweep-l)" />

    <!-- Architectural corner registration brackets -->
    <g stroke="#83BCA8" stroke-width="1.35" fill="none">
      <path d="M 18 32 L 18 18 L 32 18" />
      <path d="M 968 18 L 982 18 L 982 32" />
      <path d="M 18 228 L 18 242 L 32 242" />
      <path d="M 968 242 L 982 242 L 982 228" />
    </g>

    <!-- Right-side geometric circuit & data-stream topology -->
    <g aria-hidden="true">
      <path class="trace-base" d="M 555 58 L 652 58 L 684 90 L 732 90" />
      <path class="trace-base" d="M 588 116 L 716 116" />
      <path class="trace-base" d="M 548 176 L 648 176 L 682 142 L 732 142" />
      <path class="trace-base" d="M 852 90 L 904 90 L 934 60 L 986 60" />
      <path class="trace-base" d="M 868 116 L 986 116" />
      <path class="trace-base" d="M 852 142 L 906 142 L 936 172 L 986 172" />
      <path class="trace-base" d="M 792 22 L 792 48" />
      <path class="trace-base" d="M 792 184 L 792 204" />

      <path class="trace-flow flow-a" d="M 555 58 L 652 58 L 684 90 L 732 90" />
      <path class="trace-flow-teal flow-b" d="M 588 116 L 716 116" />
      <path class="trace-flow flow-c" d="M 548 176 L 648 176 L 682 142 L 732 142" />
      <path class="trace-flow-teal flow-d" d="M 852 90 L 904 90 L 934 60 L 986 60" />
      <path class="trace-flow flow-e" d="M 852 142 L 906 142 L 936 172 L 986 172" />

      <polygon points="792,46 862,116 792,186 722,116" fill="none" stroke="#B7D4CC" stroke-width="1" />

      <g class="ring-cw">
        <circle cx="792" cy="116" r="56" fill="none" stroke="#83BCA8" stroke-width="1.35" stroke-dasharray="18 10 6 10" />
      </g>
      <g class="ring-ccw">
        <circle cx="792" cy="116" r="41" fill="none" stroke="#1B6F7E" stroke-opacity="0.55" stroke-width="1.25" stroke-dasharray="28 16 8 16" />
      </g>

      <rect x="766" y="90" width="52" height="52" rx="12" fill="#173344" stroke="#057A55" stroke-width="1.4" />
      <path d="M 779 127 L 779 105 L 792 125 L 792 105" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 798 105 L 803 105 C 808 105 811 109.5 811 116 C 811 122.5 808 127 803 127 L 798 127 Z" fill="none" stroke="#83BCA8" stroke-width="2.1" stroke-linejoin="round" />

      <circle class="pulse-1" cx="652" cy="58" r="3" fill="#057A55" />
      <circle class="pulse-2" cx="648" cy="176" r="3" fill="#057A55" />
      <circle class="pulse-3" cx="904" cy="90" r="2.8" fill="#1B6F7E" />
      <circle class="pulse-1" cx="906" cy="142" r="2.8" fill="#057A55" />
      <circle cx="588" cy="116" r="2.4" fill="#83BCA8" />
      <circle cx="555" cy="58" r="2.4" fill="#83BCA8" />
      <circle cx="548" cy="176" r="2.4" fill="#83BCA8" />
    </g>

    <!-- Primary editorial typography -->
    <g>
      <text x="48" y="54" class="sans enter-1" font-size="13" font-weight="600" fill="#046C4E" letter-spacing="0.02em">Bandar Lampung, Indonesia  ·  Software Engineering &amp; AI</text>

      <text x="48" y="108" class="sans enter-2" font-size="44" font-weight="700" fill="#173344" letter-spacing="-0.025em">Dandi Setiawan</text>

      <text x="48" y="142" class="sans enter-3" font-size="17" font-weight="500" fill="#2A4652">Full Stack Software Engineer  ·  Artificial Intelligence Developer</text>

      <text x="48" y="170" class="sans enter-4" font-size="15.5" font-weight="400" fill="#435C63">
        Founder of <tspan font-weight="600" fill="#166270">NGOPREK DIGITAL</tspan>
      </text>
    </g>

    <line x1="48" y1="206" x2="952" y2="206" stroke="#C4DCD5" stroke-width="1" />
    <text x="48" y="232" class="serif-italic" font-size="15" fill="#166270">Connect. Collaborate. Create.</text>
    <text x="952" y="231" text-anchor="end" class="mono" font-size="12" fill="#4A656C">dandisetiawanco  ·  ngoprekdigital.site</text>
  </g>

  <rect x="1" y="1" width="998" height="258" rx="16" fill="none" stroke="#C4DCD5" stroke-width="1.25" />
</svg>
