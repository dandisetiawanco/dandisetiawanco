<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 348" width="920" height="348" role="img" aria-labelledby="hero-t-dark hero-d-dark">
  <title id="hero-t-dark">Dandi Setiawan: Full-Stack Developer &amp; AI Engineer</title>
  <desc id="hero-d-dark">Building intelligent systems, scalable applications, and software that solves real problems.</desc>
  <defs>
    <linearGradient id="hero-bg-dark" x1="0" y1="0" x2="920" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101820" />
      <stop offset="100%" stop-color="#0C131A" />
    </linearGradient>
    <linearGradient id="hero-rule-dark" x1="44" y1="0" x2="454" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="52%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="hero-spine-dark" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <clipPath id="hero-clip-dark">
      <rect x="0.75" y="0.75" width="918.5" height="346.5" rx="16" />
    </clipPath>
    <clipPath id="hero-name-mask-dark">
      <rect x="40" y="64" width="440" height="66" />
    </clipPath>
    <clipPath id="hero-role-mask-dark">
      <rect x="40" y="130" width="440" height="34" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .pkt { opacity: 0.92; }
    @media (prefers-reduced-motion: no-preference) {
      .reveal-name { animation: riseIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both; }
      .reveal-role { animation: riseIn 0.72s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both; }
      .reveal-copy { animation: fadeIn 0.8s ease-out 0.3s both; }
      .rule-grow { transform-origin: 44px 173px; animation: drawX 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
      .orbit-cw { transform-origin: 706px 176px; animation: spinCW 34s linear infinite; }
      .orbit-ccw { transform-origin: 706px 176px; animation: spinCCW 22s linear infinite; }
      .bus-e { stroke-dasharray: 9 7; animation: dashFwd 2.6s linear infinite; }
      .bus-c { stroke-dasharray: 9 7; animation: dashFwd 2.2s linear infinite; }
      .bus-v { stroke-dasharray: 9 7; animation: dashRev 2.8s linear infinite; }
      .bus-a { stroke-dasharray: 9 7; animation: dashRev 3.1s linear infinite; }
      .spine-sweep { animation: spineDown 7.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .float-hub { transform-origin: 706px 176px; animation: hubBreathe 8s ease-in-out infinite; }
      .pkt-c { animation: moveC 4.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .pkt-v { animation: moveV 4.8s cubic-bezier(0.4, 0, 0.2, 1) 0.6s infinite; }
      .pkt-e { animation: moveE 4.6s cubic-bezier(0.4, 0, 0.2, 1) 1.2s infinite; }
      .pkt-a { animation: moveA 5.0s cubic-bezier(0.4, 0, 0.2, 1) 1.8s infinite; }
      .dom-1 { animation: domFocus 12s ease-in-out 0s infinite; }
      .dom-2 { animation: domFocus 12s ease-in-out 3s infinite; }
      .dom-3 { animation: domFocus 12s ease-in-out 6s infinite; }
      .dom-4 { animation: domFocus 12s ease-in-out 9s infinite; }
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes drawX {
      from { transform: scaleX(0); opacity: 0; }
      to   { transform: scaleX(1); opacity: 1; }
    }
    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }
    @keyframes dashFwd {
      from { stroke-dashoffset: 32; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes dashRev {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: 32; }
    }
    @keyframes spineDown {
      0%        { transform: translateY(-120px); opacity: 0; }
      15%, 78%  { opacity: 0.9; }
      95%, 100% { transform: translateY(360px); opacity: 0; }
    }
    @keyframes hubBreathe {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-4px); }
    }
    @keyframes moveC {
      0%   { transform: translate(0px, 0px); opacity: 0; }
      12%  { opacity: 1; }
      40%  { transform: translate(0px, 36px); opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translate(82px, 36px); opacity: 0; }
    }
    @keyframes moveV {
      0%   { transform: translate(0px, 0px); opacity: 0; }
      12%  { opacity: 1; }
      40%  { transform: translate(0px, 36px); opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translate(-85px, 36px); opacity: 0; }
    }
    @keyframes moveE {
      0%   { transform: translate(0px, 0px); opacity: 0; }
      12%  { opacity: 1; }
      40%  { transform: translate(0px, -36px); opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translate(82px, -36px); opacity: 0; }
    }
    @keyframes moveA {
      0%   { transform: translate(0px, 0px); opacity: 0; }
      12%  { opacity: 1; }
      40%  { transform: translate(0px, -36px); opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translate(-85px, -36px); opacity: 0; }
    }
    @keyframes domFocus {
      0%, 22%   { opacity: 1; }
      30%, 100% { opacity: 0.58; }
    }
  </style>

  <g clip-path="url(#hero-clip-dark)">
    <rect x="0" y="0" width="920" height="348" fill="url(#hero-bg-dark)" />

    <!-- Top architectural 4-domain identity motif -->
    <rect x="44" y="0.75" width="32" height="3" fill="#10B981" />
    <rect x="80" y="0.75" width="24" height="3" fill="#22D3EE" />
    <rect x="108" y="0.75" width="20" height="3" fill="#8B5CF6" />
    <rect x="132" y="0.75" width="16" height="3" fill="#F59E0B" />

    <!-- Architectural coordinate grid on right systems canvas -->
    <g aria-hidden="true" opacity="0.65">
      <line x1="520" y1="16" x2="520" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="556" y1="16" x2="556" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="592" y1="16" x2="592" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="628" y1="16" x2="628" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="664" y1="16" x2="664" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="700" y1="16" x2="700" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="736" y1="16" x2="736" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="772" y1="16" x2="772" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="808" y1="16" x2="808" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="844" y1="16" x2="844" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="880" y1="16" x2="880" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="916" y1="16" x2="916" y2="332" stroke="#1B2836" stroke-width="1" />
      <line x1="504" y1="36" x2="908" y2="36" stroke="#1B2836" stroke-width="1" />
      <line x1="504" y1="72" x2="908" y2="72" stroke="#1B2836" stroke-width="1" />
      <line x1="504" y1="108" x2="908" y2="108" stroke="#1B2836" stroke-width="1" />
      <line x1="504" y1="144" x2="908" y2="144" stroke="#1B2836" stroke-width="1" />
      <line x1="504" y1="180" x2="908" y2="180" stroke="#1B2836" stroke-width="1" />
      <line x1="504" y1="216" x2="908" y2="216" stroke="#1B2836" stroke-width="1" />
      <line x1="504" y1="252" x2="908" y2="252" stroke="#1B2836" stroke-width="1" />
      <line x1="504" y1="288" x2="908" y2="288" stroke="#1B2836" stroke-width="1" />
      <line x1="504" y1="324" x2="908" y2="324" stroke="#1B2836" stroke-width="1" />
      <path d="M 551 72 L 561 72 M 556 67 L 556 77" stroke="#33485C" stroke-width="1" />
      <path d="M 839 72 L 849 72 M 844 67 L 844 77" stroke="#33485C" stroke-width="1" />
      <path d="M 551 288 L 561 288 M 556 283 L 556 293" stroke="#33485C" stroke-width="1" />
      <path d="M 839 288 L 849 288 M 844 283 L 844 293" stroke="#33485C" stroke-width="1" />
      <path d="M 695 180 L 705 180 M 700 175 L 700 185" stroke="#33485C" stroke-width="1" />
    </g>

    <!-- Editorial vertical partition with travelling vertical signal -->
    <line x1="504" y1="0" x2="504" y2="348" stroke="#1E2C3A" stroke-width="1" />
    <rect class="spine-sweep" x="503.25" y="0" width="1.5" height="120" fill="url(#hero-spine-dark)" />

    <!-- Left editorial typography -->
    <text x="44" y="48" class="mono" font-size="10.2" font-weight="600" fill="#94A3B8" letter-spacing="0.06em">BANDAR LAMPUNG  ·  5.4292° S, 105.2610° E</text>

    <g clip-path="url(#hero-name-mask-dark)">
      <text x="44" y="114" class="sans reveal-name" font-size="50" font-weight="700" fill="#F8FAFC" letter-spacing="-0.032em">Dandi Setiawan</text>
    </g>

    <g clip-path="url(#hero-role-mask-dark)">
      <text x="44" y="152" class="sans reveal-role" font-size="19.5" font-weight="600" fill="#34D399" letter-spacing="-0.01em">Full-Stack Developer &amp; AI Engineer</text>
    </g>

    <line x1="44" y1="173" x2="454" y2="173" stroke="#1E2C3A" stroke-width="1.2" />
    <line class="rule-grow" x1="44" y1="173" x2="454" y2="173" stroke="url(#hero-rule-dark)" stroke-width="1.8" />

    <g class="reveal-copy">
      <text x="44" y="206" class="sans" font-size="14.5" font-weight="400" fill="#CBD5E1">Building intelligent systems, scalable applications,</text>
      <text x="44" y="228" class="sans" font-size="14.5" font-weight="400" fill="#CBD5E1">and software that solves real problems.</text>
    </g>

    <!-- Four semantic domain index markers matching right topology -->
    <g transform="translate(44, 272)">
      <g class="dom-1">
        <rect x="0" y="0" width="3" height="28" rx="1.5" fill="#22D3EE" />
        <text x="11" y="12" class="mono" font-size="9.5" font-weight="600" fill="#22D3EE">01</text>
        <text x="11" y="26" class="sans" font-size="12" font-weight="600" fill="#F8FAFC">Full-Stack</text>
      </g>
      <g class="dom-2" transform="translate(106, 0)">
        <rect x="0" y="0" width="3" height="28" rx="1.5" fill="#8B5CF6" />
        <text x="11" y="12" class="mono" font-size="9.5" font-weight="600" fill="#C4B5FD">02</text>
        <text x="11" y="26" class="sans" font-size="12" font-weight="600" fill="#F8FAFC">AI Agents</text>
      </g>
      <g class="dom-3" transform="translate(208, 0)">
        <rect x="0" y="0" width="3" height="28" rx="1.5" fill="#10B981" />
        <text x="11" y="12" class="mono" font-size="9.5" font-weight="600" fill="#34D399">03</text>
        <text x="11" y="26" class="sans" font-size="12" font-weight="600" fill="#F8FAFC">Systems</text>
      </g>
      <g class="dom-4" transform="translate(304, 0)">
        <rect x="0" y="0" width="3" height="28" rx="1.5" fill="#F59E0B" />
        <text x="11" y="12" class="mono" font-size="9.5" font-weight="600" fill="#FBBF24">04</text>
        <text x="11" y="26" class="sans" font-size="12" font-weight="600" fill="#F8FAFC">Data</text>
      </g>
    </g>

    <!-- Right custom distributed-systems architecture illustration -->
    <g aria-hidden="true">
      <!-- Concentric orchestration rings -->
      <circle cx="706" cy="176" r="106" fill="none" stroke="#1E2C3A" stroke-width="1" />
      <circle class="orbit-cw" cx="706" cy="176" r="88" fill="none" stroke="#33485C" stroke-width="1.15" stroke-dasharray="18 10 4 10" />
      <circle class="orbit-ccw" cx="706" cy="176" r="64" fill="none" stroke="#10B981" stroke-width="1.35" stroke-dasharray="52 38 14 38" stroke-opacity="0.78" />

      <!-- Orthogonal data pathways linking four architectural domains to core -->
      <path d="M 582 122 L 582 158 L 664 158" fill="none" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="2" />
      <path class="bus-c" d="M 582 122 L 582 158 L 664 158" fill="none" stroke="#22D3EE" stroke-width="1.6" />

      <path d="M 833 122 L 833 158 L 748 158" fill="none" stroke="#8B5CF6" stroke-opacity="0.28" stroke-width="2" />
      <path class="bus-v" d="M 833 122 L 833 158 L 748 158" fill="none" stroke="#8B5CF6" stroke-width="1.6" />

      <path d="M 582 230 L 582 194 L 664 194" fill="none" stroke="#10B981" stroke-opacity="0.28" stroke-width="2" />
      <path class="bus-e" d="M 582 230 L 582 194 L 664 194" fill="none" stroke="#10B981" stroke-width="1.6" />

      <path d="M 833 230 L 833 194 L 748 194" fill="none" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="2" />
      <path class="bus-a" d="M 833 230 L 833 194 L 748 194" fill="none" stroke="#F59E0B" stroke-width="1.6" />

      <!-- Travelling signal packets anchored to node ports -->
      <circle class="pkt pkt-c" cx="582" cy="122" r="3.4" fill="#22D3EE" />
      <circle class="pkt pkt-v" cx="833" cy="122" r="3.4" fill="#8B5CF6" />
      <circle class="pkt pkt-e" cx="582" cy="230" r="3.4" fill="#10B981" />
      <circle class="pkt pkt-a" cx="833" cy="230" r="3.4" fill="#F59E0B" />

      <!-- Node 01: Interface & Client (Top-Left) -->
      <g>
        <rect x="526" y="64" width="112" height="58" rx="9" fill="#162430" stroke="#22D3EE" stroke-width="1.25" />
        <rect x="538" y="76" width="16" height="11" rx="2" fill="none" stroke="#22D3EE" stroke-width="1.3" />
        <line x1="538" y1="80" x2="554" y2="80" stroke="#22D3EE" stroke-width="1.1" />
        <text x="562" y="85" class="mono" font-size="9.5" font-weight="700" fill="#22D3EE">CLIENT</text>
        <text x="538" y="106" class="sans" font-size="11" font-weight="600" fill="#F8FAFC">React · Next.js</text>
      </g>

      <!-- Node 02: AI Agent Runtime (Top-Right) -->
      <g>
        <rect x="774" y="64" width="118" height="58" rx="9" fill="#162430" stroke="#8B5CF6" stroke-width="1.25" />
        <circle cx="788" cy="80" r="2.4" fill="#8B5CF6" />
        <circle cx="798" cy="80" r="2.4" fill="#8B5CF6" />
        <circle cx="793" cy="88" r="2.4" fill="#8B5CF6" />
        <path d="M 788 80 L 798 80 L 793 88 Z" fill="none" stroke="#8B5CF6" stroke-width="1.1" />
        <text x="807" y="85" class="mono" font-size="9.5" font-weight="700" fill="#C4B5FD">AGENTS</text>
        <text x="786" y="106" class="sans" font-size="11" font-weight="600" fill="#F8FAFC">LangGraph · LLM</text>
      </g>

      <!-- Node 03: API & Native Systems (Bottom-Left) -->
      <g>
        <rect x="526" y="230" width="112" height="58" rx="9" fill="#13212D" stroke="#10B981" stroke-width="1.25" />
        <polygon points="545,241 552,245 552,253 545,257 538,253 538,245" fill="none" stroke="#10B981" stroke-width="1.3" />
        <text x="560" y="252" class="mono" font-size="9.5" font-weight="700" fill="#34D399">SERVICES</text>
        <text x="538" y="272" class="sans" font-size="11" font-weight="600" fill="#F8FAFC">FastAPI · Rust</text>
      </g>

      <!-- Node 04: Data & Ledger (Bottom-Right) -->
      <g>
        <rect x="774" y="230" width="118" height="58" rx="9" fill="#13212D" stroke="#F59E0B" stroke-width="1.25" />
        <ellipse cx="793" cy="244" rx="6.5" ry="2.6" fill="none" stroke="#F59E0B" stroke-width="1.3" />
        <path d="M 786.5 244 L 786.5 253 C 786.5 255 799.5 255 799.5 253 L 799.5 244" fill="none" stroke="#F59E0B" stroke-width="1.3" />
        <text x="807" y="252" class="mono" font-size="9.5" font-weight="700" fill="#FBBF24">STORAGE</text>
        <text x="786" y="272" class="sans" font-size="11" font-weight="600" fill="#F8FAFC">Postgres · SQL</text>
      </g>

      <!-- Central Layered Architectural Core Hub -->
      <g class="float-hub">
        <polygon points="706,134 748,158 748,194 706,218 664,194 664,158" fill="#13232D" stroke="#10B981" stroke-width="1.6" />
        <polygon points="706,144 738,162 738,190 706,208 674,190 674,162" fill="#112924" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1" />
        <text x="706" y="172" text-anchor="middle" class="mono" font-size="10.2" font-weight="700" fill="#34D399">CORE</text>
        <text x="706" y="187" text-anchor="middle" class="mono" font-size="9.2" font-weight="600" fill="#F8FAFC">SYSTEMS</text>
      </g>

      <text x="892" y="328" text-anchor="end" class="mono" font-size="9.8" fill="#94A3B8">11 PUBLIC REPOS  ·  UPDATED 2026-11-27</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="918.5" height="346.5" rx="16" fill="none" stroke="#263646" stroke-width="1.2" />
</svg>
