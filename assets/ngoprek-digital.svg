<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="900" height="176" role="img" aria-labelledby="nd-title nd-desc">
  <title id="nd-title">NGOPREK DIGITAL: Connect. Collaborate. Create.</title>
  <desc id="nd-desc">Brand spotlight card for NGOPREK DIGITAL, a multidisciplinary technology collective focused on engineering, AI, collaboration, and digital products.</desc>
  <defs>
    <linearGradient id="nd-bg" x1="0" y1="0" x2="900" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C1B25" />
      <stop offset="100%" stop-color="#132934" />
    </linearGradient>
    <radialGradient id="nd-glow" cx="820" cy="40" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#132934" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .serif-italic { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <rect x="1" y="1" width="898" height="174" rx="14" fill="url(#nd-bg)" stroke="#1F424D" stroke-width="1.25" />
  <rect x="1" y="1" width="898" height="174" rx="14" fill="url(#nd-glow)" />

  <!-- Corner brackets -->
  <g stroke="#2B5B53" stroke-width="1.2" fill="none">
    <path d="M 16 26 L 16 14 L 28 14" />
    <path d="M 872 14 L 884 14 L 884 26" />
    <path d="M 16 150 L 16 162 L 28 162" />
    <path d="M 872 162 L 884 162 L 884 150" />
  </g>

  <!-- ND Monogram Badge -->
  <rect x="34" y="34" width="56" height="56" rx="14" fill="#0F2530" stroke="#34D399" stroke-opacity="0.7" stroke-width="1.4" />
  <path d="M 48 74 L 48 50 L 62 72 L 62 50" fill="none" stroke="#F0F7F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 68 50 L 73 50 C 78.5 50 82 54.5 82 62 C 82 69.5 78.5 74 73 74 L 68 74 Z" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Brand Lockup -->
  <text x="110" y="57" class="sans" font-size="22" font-weight="700" fill="#F0F7F4" letter-spacing="0.02em">NGOPREK DIGITAL</text>
  <text x="110" y="81" class="serif-italic" font-size="16" fill="#5EEAD4">Connect. Collaborate. Create.</text>

  <!-- Role & Website Pill -->
  <rect x="704" y="38" width="162" height="32" rx="8" fill="#133330" stroke="#2D7563" stroke-width="1" />
  <text x="785" y="59" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#34D399">ngoprekdigital.site</text>

  <line x1="34" y1="112" x2="866" y2="112" stroke="#1E3C48" stroke-width="1" />

  <!-- Disciplines Row -->
  <text x="34" y="143" class="sans" font-size="13.5" font-weight="500" fill="#C9E2DA">Software Engineering  ·  Artificial Intelligence  ·  Web &amp; Mobile Platforms  ·  UI/UX Design</text>
  <text x="866" y="143" text-anchor="end" class="sans" font-size="12.5" font-weight="500" fill="#8CB3A9">Founded by Dandi Setiawan</text>
</svg>
