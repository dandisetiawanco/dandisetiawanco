<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 212" width="440" height="212" role="img" aria-labelledby="langs-t-dark langs-d-dark">
  <title id="langs-t-dark">Most-Used Languages for dandisetiawanco</title>
  <desc id="langs-d-dark">Programming language distribution across owned non-fork public GitHub repositories.</desc>
  <defs>
    <linearGradient id="lg-bg-dark" x1="0" y1="0" x2="440" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F14" />
      <stop offset="100%" stop-color="#0E1715" />
    </linearGradient>
    <linearGradient id="lg-sheen-dark" x1="0" y1="0" x2="110" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <clipPath id="lang-bar-dark">
      <rect x="20" y="60" width="400" height="10" rx="5" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .bar-sheen { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .bar-sheen { animation: sheenPass 6.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
            .sw-0 { animation: swPulse 6.6s ease-in-out 0.0s infinite; transform-origin: 25px 101px; }
      .sw-1 { animation: swPulse 6.6s ease-in-out 1.1s infinite; transform-origin: 235px 101px; }
      .sw-2 { animation: swPulse 6.6s ease-in-out 2.2s infinite; transform-origin: 25px 134px; }
      .sw-3 { animation: swPulse 6.6s ease-in-out 3.3s infinite; transform-origin: 235px 134px; }
      .sw-4 { animation: swPulse 6.6s ease-in-out 4.4s infinite; transform-origin: 25px 167px; }
      .sw-5 { animation: swPulse 6.6s ease-in-out 5.5s infinite; transform-origin: 235px 167px; }
    }
    @keyframes sheenPass {
      0%        { transform: translateX(-90px); opacity: 0; }
      15%, 75%  { opacity: 1; }
      92%, 100% { transform: translateX(440px); opacity: 0; }
    }
    @keyframes swPulse {
      0%, 16%  { transform: scale(1.22); }
      26%, 100%{ transform: scale(1); }
    }
  </style>
  <rect x="0.75" y="0.75" width="438.5" height="210.5" rx="12" fill="url(#lg-bg-dark)" stroke="#23342E" stroke-width="1.2" />
  <text x="20" y="32" class="sans" font-size="14.5" font-weight="700" fill="#F8FAFC">Most-Used Languages</text>
  <text x="420" y="31.5" text-anchor="end" class="mono" font-size="10.8" fill="#94A3B8">Owned public repos</text>
  <line x1="20" y1="45" x2="420" y2="45" stroke="#1B2825" stroke-width="1" />
  <rect x="20" y="60" width="400" height="10" rx="5" fill="#111820" />
  <g clip-path="url(#lang-bar-dark)">
    <rect x="20.0" y="60" width="127.2" height="10" fill="#34D399" />
    <rect x="149.2" y="60" width="81.1" height="10" fill="#10B981" />
    <rect x="232.3" y="60" width="62.6" height="10" fill="#6EE7B7" />
    <rect x="296.9" y="60" width="54.5" height="10" fill="#059669" />
    <rect x="353.4" y="60" width="45.2" height="10" fill="#94A3B8" />
    <rect x="400.6" y="60" width="19.4" height="10" fill="#4E6860" />
    <rect class="bar-sheen" x="20" y="60" width="110" height="10" fill="url(#lg-sheen-dark)" />
  </g>
  <g>
    <rect class="sw-0" x="20" y="96" width="10" height="10" rx="2.5" fill="#34D399" />
    <text x="38" y="106" class="sans" font-size="13" font-weight="600" fill="#F8FAFC">Python</text>
    <text x="206" y="106" text-anchor="end" class="mono" font-size="12" fill="#CBD5E1">31.5%</text>
  </g>
  <g>
    <rect class="sw-1" x="230" y="96" width="10" height="10" rx="2.5" fill="#10B981" />
    <text x="248" y="106" class="sans" font-size="13" font-weight="600" fill="#F8FAFC">TypeScript</text>
    <text x="416" y="106" text-anchor="end" class="mono" font-size="12" fill="#CBD5E1">20.1%</text>
  </g>
  <g>
    <rect class="sw-2" x="20" y="129" width="10" height="10" rx="2.5" fill="#6EE7B7" />
    <text x="38" y="139" class="sans" font-size="13" font-weight="600" fill="#F8FAFC">PHP</text>
    <text x="206" y="139" text-anchor="end" class="mono" font-size="12" fill="#CBD5E1">15.5%</text>
  </g>
  <g>
    <rect class="sw-3" x="230" y="129" width="10" height="10" rx="2.5" fill="#059669" />
    <text x="248" y="139" class="sans" font-size="13" font-weight="600" fill="#F8FAFC">JavaScript</text>
    <text x="416" y="139" text-anchor="end" class="mono" font-size="12" fill="#CBD5E1">13.5%</text>
  </g>
  <g>
    <rect class="sw-4" x="20" y="162" width="10" height="10" rx="2.5" fill="#94A3B8" />
    <text x="38" y="172" class="sans" font-size="13" font-weight="600" fill="#F8FAFC">Blade</text>
    <text x="206" y="172" text-anchor="end" class="mono" font-size="12" fill="#CBD5E1">11.2%</text>
  </g>
  <g>
    <rect class="sw-5" x="230" y="162" width="10" height="10" rx="2.5" fill="#4E6860" />
    <text x="248" y="172" class="sans" font-size="13" font-weight="600" fill="#F8FAFC">CSS</text>
    <text x="416" y="172" text-anchor="end" class="mono" font-size="12" fill="#CBD5E1">4.8%</text>
  </g>
</svg>
