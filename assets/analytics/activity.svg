  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .curve-pulse, .rib-scan { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .curve-pulse {
        opacity: 1;
        stroke-dasharray: 110 890;
        animation: traceSpline 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .rib-scan {
        animation: scanRibbon 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
            .pt-0 { animation: dotBeacon 6s ease-in-out 1.20s infinite; transform-origin: 238.2px 81.0px; }
      .pt-1 { animation: dotBeacon 6s ease-in-out 1.30s infinite; transform-origin: 254.0px 136.2px; }
      .pt-2 { animation: dotBeacon 6s ease-in-out 2.10s infinite; transform-origin: 380.8px 145.4px; }
      .pt-3 { animation: dotBeacon 6s ease-in-out 2.30s infinite; transform-origin: 412.5px 140.8px; }
      .pt-4 { animation: dotBeacon 6s ease-in-out 3.60s infinite; transform-origin: 618.5px 136.2px; }
      .pt-5 { animation: dotBeacon 6s ease-in-out 4.20s infinite; transform-origin: 713.5px 145.4px; }
      .pt-6 { animation: dotBeacon 6s ease-in-out 4.30s infinite; transform-origin: 729.4px 140.8px; }
      .pt-7 { animation: dotBeacon 6s ease-in-out 5.20s infinite; transform-origin: 872.0px 58.0px; }
    }
    @keyframes traceSpline {
      0%   { stroke-dashoffset: 1000; opacity: 0; }
      10%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes dotBeacon {
      0%, 14%  { transform: scale(1.38); }
      26%, 100%{ transform: scale(1); }
    }
    @keyframes scanRibbon {
      0%        { transform: translateX(-160px); opacity: 0; }
      12%, 82%  { opacity: 0.9; }
      96%, 100% { transform: translateX(880px); opacity: 0; }
    }
  </style>

