<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 138" width="920" height="138" role="img" aria-labelledby="rp-t-dark rp-d-dark">
  <title id="rp-t-dark">Recently Shipped Repository Activity Pulse</title>
  <desc id="rp-d-dark">Live chronological delivery pulse across the 5 most recently updated public repositories.</desc>
  <defs>
    <linearGradient id="rp-bg-dark" x1="0" y1="0" x2="920" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101820" />
      <stop offset="100%" stop-color="#0C131A" />
    </linearGradient>
    <linearGradient id="rp-beam-dark" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <clipPath id="rp-rail-dark">
      <rect x="64" y="70" width="792" height="8" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .rail-beam { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .rail-beam { animation: railSweep 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .nd-0 { animation: nodePing 6.5s ease-in-out 0.0s infinite; transform-origin: 84.0px 74px; }
      .nd-1 { animation: nodePing 6.5s ease-in-out 1.1s infinite; transform-origin: 272.0px 74px; }
      .nd-2 { animation: nodePing 6.5s ease-in-out 2.2s infinite; transform-origin: 460.0px 74px; }
      .nd-3 { animation: nodePing 6.5s ease-in-out 3.3s infinite; transform-origin: 648.0px 74px; }
      .nd-4 { animation: nodePing 6.5s ease-in-out 4.4s infinite; transform-origin: 836.0px 74px; }
    }
    @keyframes railSweep {
      0%        { transform: translateX(-180px); opacity: 0; }
      14%, 82%  { opacity: 1; }
      96%, 100% { transform: translateX(820px); opacity: 0; }
    }
    @keyframes nodePing {
      0%, 16%   { transform: scale(1.24); }
      28%, 100% { transform: scale(1); }
    }
  </style>
  <rect x="0.75" y="0.75" width="918.5" height="136.5" rx="12" fill="url(#rp-bg-dark)" stroke="#263646" stroke-width="1.15" />
  <text x="24" y="26" class="mono" font-size="9.8" font-weight="700" fill="#34D399">LIVE DELIVERY TIMELINE  ·  NEWEST TO EARLIER</text>
  <text x="896" y="26" text-anchor="end" class="mono" font-size="9.5" fill="#94A3B8">AUTO-SYNCED 2026-11-27 12:11 UTC</text>

  <line x1="64" y1="74" x2="856" y2="74" stroke="#263646" stroke-width="2" stroke-linecap="round" />
  <g clip-path="url(#rp-rail-dark)">
    <rect class="rail-beam" x="64" y="72.5" width="180" height="3" fill="url(#rp-beam-dark)" />
  </g>

  <g>
    <circle class="nd-0" cx="84.0" cy="74" r="7" fill="#16212C" stroke="#F59E0B" stroke-width="2.2" />
    <circle cx="84.0" cy="74" r="2.8" fill="#F59E0B" />
    <text x="84.0" y="54" text-anchor="middle" class="sans" font-size="12.2" font-weight="700" fill="#F8FAFC">Ledger</text>
    <text x="84.0" y="102" text-anchor="middle" class="mono" font-size="9.8" font-weight="600" fill="#CBD5E1">Java</text>
    <text x="84.0" y="117" text-anchor="middle" class="mono" font-size="9.2" fill="#94A3B8">11-26</text>
  </g>
  <g>
    <circle class="nd-1" cx="272.0" cy="74" r="7" fill="#16212C" stroke="#22D3EE" stroke-width="2.2" />
    <circle cx="272.0" cy="74" r="2.8" fill="#22D3EE" />
    <text x="272.0" y="54" text-anchor="middle" class="sans" font-size="12.2" font-weight="700" fill="#F8FAFC">InfraOS</text>
    <text x="272.0" y="102" text-anchor="middle" class="mono" font-size="9.8" font-weight="600" fill="#CBD5E1">Go</text>
    <text x="272.0" y="117" text-anchor="middle" class="mono" font-size="9.2" fill="#94A3B8">11-25</text>
  </g>
  <g>
    <circle class="nd-2" cx="460.0" cy="74" r="7" fill="#16212C" stroke="#22D3EE" stroke-width="2.2" />
    <circle cx="460.0" cy="74" r="2.8" fill="#22D3EE" />
    <text x="460.0" y="54" text-anchor="middle" class="sans" font-size="12.2" font-weight="700" fill="#F8FAFC">TalentOS</text>
    <text x="460.0" y="102" text-anchor="middle" class="mono" font-size="9.8" font-weight="600" fill="#CBD5E1">TypeScript</text>
    <text x="460.0" y="117" text-anchor="middle" class="mono" font-size="9.2" fill="#94A3B8">11-25</text>
  </g>
  <g>
    <circle class="nd-3" cx="648.0" cy="74" r="7" fill="#16212C" stroke="#8B5CF6" stroke-width="2.2" />
    <circle cx="648.0" cy="74" r="2.8" fill="#8B5CF6" />
    <text x="648.0" y="54" text-anchor="middle" class="sans" font-size="12.2" font-weight="700" fill="#F8FAFC">Omnidesk</text>
    <text x="648.0" y="102" text-anchor="middle" class="mono" font-size="9.8" font-weight="600" fill="#CBD5E1">Python</text>
    <text x="648.0" y="117" text-anchor="middle" class="mono" font-size="9.2" fill="#94A3B8">11-24</text>
  </g>
  <g>
    <circle class="nd-4" cx="836.0" cy="74" r="7" fill="#16212C" stroke="#8B5CF6" stroke-width="2.2" />
    <circle cx="836.0" cy="74" r="2.8" fill="#8B5CF6" />
    <text x="836.0" y="54" text-anchor="middle" class="sans" font-size="12.2" font-weight="700" fill="#F8FAFC">AgentOs</text>
    <text x="836.0" y="102" text-anchor="middle" class="mono" font-size="9.8" font-weight="600" fill="#CBD5E1">Python</text>
    <text x="836.0" y="117" text-anchor="middle" class="mono" font-size="9.2" fill="#94A3B8">11-23</text>
  </g>
</svg>
