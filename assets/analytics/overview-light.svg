<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 278" width="920" height="278" role="img" aria-labelledby="ov-t-light ov-d-light">
  <title id="ov-t-light">Public Engineering Overview and Language Distribution</title>
  <desc id="ov-d-light">Verified public GitHub statistics (92 public contributions across 11 public repositories) and byte-weighted language distribution.</desc>
  <defs>
    <linearGradient id="ov-bg-light" x1="0" y1="0" x2="920" y2="278" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="ov-sheen-light" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <clipPath id="ov-bar-clip-light">
      <rect x="392" y="66" width="496" height="10" rx="5" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .sheen { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .sheen { animation: sheenRun 6.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .donut-spin { transform-origin: 474px 176px; animation: donutEase 1.1s cubic-bezier(0.16, 1, 0.3, 1) both; }
    }
    @keyframes sheenRun {
      0%        { transform: translateX(-110px); opacity: 0; }
      18%, 78%  { opacity: 1; }
      94%, 100% { transform: translateX(520px); opacity: 0; }
    }
    @keyframes donutEase {
      from { transform: rotate(-28deg); opacity: 0.4; }
      to   { transform: rotate(0deg); opacity: 1; }
    }
  </style>
  <rect x="0.75" y="0.75" width="918.5" height="276.5" rx="14" fill="url(#ov-bg-light)" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- Left editorial KPI ledger -->
  <text x="30" y="34" class="sans" font-size="14.5" font-weight="700" fill="#0F172A">Public Engineering Scope</text>
  <text x="30" y="51" class="mono" font-size="9.5" fill="#475569">TRAILING 52 WEEKS  ·  SYNC 2026-11-27</text>

  <text x="30" y="112" class="mono" font-size="44" font-weight="700" fill="#047857" letter-spacing="-0.03em">92</text>
  <text x="30" y="132" class="sans" font-size="12.5" font-weight="600" fill="#334155">Public Contributions</text>

  <line x1="30" y1="150" x2="346" y2="150" stroke="#E2E8F0" stroke-width="1" />

  <text x="30" y="176" class="mono" font-size="20" font-weight="700" fill="#0F172A">11</text>
  <text x="30" y="193" class="sans" font-size="11" fill="#475569">Public Repositories</text>

  <text x="196" y="176" class="mono" font-size="20" font-weight="700" fill="#0E7490">80</text>
  <text x="196" y="193" class="sans" font-size="11" fill="#475569">Public Commits</text>

  <line x1="30" y1="208" x2="346" y2="208" stroke="#E2E8F0" stroke-width="1" />

  <text x="30" y="234" class="mono" font-size="20" font-weight="700" fill="#B45309">4</text>
  <text x="30" y="251" class="sans" font-size="11" fill="#475569">Stars Earned</text>

  <text x="196" y="234" class="mono" font-size="20" font-weight="700" fill="#6D28D9">11d / 4d</text>
  <text x="196" y="251" class="sans" font-size="11" fill="#475569">Active Days / Peak Streak</text>

  <!-- Vertical separator -->
  <line x1="366" y1="22" x2="366" y2="256" stroke="#E2E8F0" stroke-width="1" />

  <!-- Right language spectrum & radial ring -->
  <text x="392" y="34" class="sans" font-size="14.5" font-weight="700" fill="#0F172A">Language Distribution</text>
  <text x="888" y="34" text-anchor="end" class="mono" font-size="9.5" fill="#475569">OWNED NON-FORK PUBLIC REPOS (BY BYTES)</text>

  <rect x="392" y="66" width="496" height="10" rx="5" fill="#F1F5F9" />
  <g clip-path="url(#ov-bar-clip-light)">
    <rect x="392.0" y="66" width="172.8" height="10" fill="#0891B2" />
    <rect x="567.3" y="66" width="129.2" height="10" fill="#7C3AED" />
    <rect x="699.1" y="66" width="69.5" height="10" fill="#D97706" />
    <rect x="771.0" y="66" width="39.3" height="10" fill="#059669" />
    <rect x="812.8" y="66" width="38.2" height="10" fill="#0284C7" />
    <rect x="853.5" y="66" width="34.5" height="10" fill="#475569" />
    <rect class="sheen" x="392" y="66" width="120" height="10" fill="url(#ov-sheen-light)" />
  </g>

  <g class="donut-spin">
    <circle cx="474.0" cy="176.0" r="52.0" fill="none" stroke="#F1F5F9" stroke-width="13" />
    <circle cx="474.0" cy="176.0" r="52.0" fill="none" stroke="#0891B2" stroke-width="13" stroke-dasharray="114.29 326.73" stroke-dashoffset="-0.00" transform="rotate(-90 474.0 176.0)" />
    <circle cx="474.0" cy="176.0" r="52.0" fill="none" stroke="#7C3AED" stroke-width="13" stroke-dasharray="84.82 326.73" stroke-dashoffset="-116.79" transform="rotate(-90 474.0 176.0)" />
    <circle cx="474.0" cy="176.0" r="52.0" fill="none" stroke="#D97706" stroke-width="13" stroke-dasharray="44.43 326.73" stroke-dashoffset="-204.11" transform="rotate(-90 474.0 176.0)" />
    <circle cx="474.0" cy="176.0" r="52.0" fill="none" stroke="#059669" stroke-width="13" stroke-dasharray="24.06 326.73" stroke-dashoffset="-251.05" transform="rotate(-90 474.0 176.0)" />
    <circle cx="474.0" cy="176.0" r="52.0" fill="none" stroke="#0284C7" stroke-width="13" stroke-dasharray="23.33 326.73" stroke-dashoffset="-277.61" transform="rotate(-90 474.0 176.0)" />
    <circle cx="474.0" cy="176.0" r="52.0" fill="none" stroke="#475569" stroke-width="13" stroke-dasharray="20.79 326.73" stroke-dashoffset="-303.44" transform="rotate(-90 474.0 176.0)" />
  </g>
  <text x="474.0" y="174.0" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#0F172A">6</text>
  <text x="474.0" y="190.0" text-anchor="middle" class="mono" font-size="9.2" fill="#475569">LANGUAGES</text>

  <g>
    <rect x="572" y="107" width="9" height="9" rx="2" fill="#0891B2" />
    <text x="589" y="116" class="sans" font-size="12.5" font-weight="600" fill="#0F172A">TypeScript</text>
    <text x="888" y="116" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#334155">32.1%</text>
    <line x1="572" y1="124" x2="888" y2="124" stroke="#E2E8F0" stroke-width="0.8" />
  </g>
  <g>
    <rect x="572" y="131" width="9" height="9" rx="2" fill="#7C3AED" />
    <text x="589" y="140" class="sans" font-size="12.5" font-weight="600" fill="#0F172A">Python</text>
    <text x="888" y="140" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#334155">24.0%</text>
    <line x1="572" y1="148" x2="888" y2="148" stroke="#E2E8F0" stroke-width="0.8" />
  </g>
  <g>
    <rect x="572" y="155" width="9" height="9" rx="2" fill="#D97706" />
    <text x="589" y="164" class="sans" font-size="12.5" font-weight="600" fill="#0F172A">Java</text>
    <text x="888" y="164" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#334155">12.9%</text>
    <line x1="572" y1="172" x2="888" y2="172" stroke="#E2E8F0" stroke-width="0.8" />
  </g>
  <g>
    <rect x="572" y="179" width="9" height="9" rx="2" fill="#059669" />
    <text x="589" y="188" class="sans" font-size="12.5" font-weight="600" fill="#0F172A">PHP</text>
    <text x="888" y="188" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#334155">7.3%</text>
    <line x1="572" y1="196" x2="888" y2="196" stroke="#E2E8F0" stroke-width="0.8" />
  </g>
  <g>
    <rect x="572" y="203" width="9" height="9" rx="2" fill="#0284C7" />
    <text x="589" y="212" class="sans" font-size="12.5" font-weight="600" fill="#0F172A">Go</text>
    <text x="888" y="212" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#334155">7.1%</text>
    <line x1="572" y1="220" x2="888" y2="220" stroke="#E2E8F0" stroke-width="0.8" />
  </g>
  <g>
    <rect x="572" y="227" width="9" height="9" rx="2" fill="#475569" />
    <text x="589" y="236" class="sans" font-size="12.5" font-weight="600" fill="#0F172A">JavaScript</text>
    <text x="888" y="236" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#334155">6.4%</text>
    <line x1="572" y1="244" x2="888" y2="244" stroke="#E2E8F0" stroke-width="0.8" />
  </g>
</svg>
