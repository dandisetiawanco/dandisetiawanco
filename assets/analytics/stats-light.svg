<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 212" width="440" height="212" role="img" aria-labelledby="stats-t-light stats-d-light">
  <title id="stats-t-light">GitHub Statistics for dandisetiawanco (Public Scope)</title>
  <desc id="stats-d-light">Public GitHub metrics over the trailing 12 months: 82 public contributions, 11 public repositories, 70 public commits.</desc>
  <defs>
    <linearGradient id="st-bg-light" x1="0" y1="0" x2="440" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F6FAF8" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: no-preference) {
            .mc-0 { animation: statCycle 8.4s ease-in-out 0.0s infinite; }
      .mc-1 { animation: statCycle 8.4s ease-in-out 1.4s infinite; }
      .mc-2 { animation: statCycle 8.4s ease-in-out 2.8s infinite; }
      .mc-3 { animation: statCycle 8.4s ease-in-out 4.2s infinite; }
      .mc-4 { animation: statCycle 8.4s ease-in-out 5.6s infinite; }
      .mc-5 { animation: statCycle 8.4s ease-in-out 7.0s infinite; }
      .k-bar { animation: barPulse 4.2s ease-in-out infinite; }
    }
    @keyframes statCycle {
      0%, 16%  { stroke: #6EE7B7; fill: #ECFDF5; }
      24%, 100%{ stroke: #DCE6E2; fill: #F8FBFA; }
    }
    @keyframes barPulse {
      0%, 100% { opacity: 0.75; width: 24px; }
      50%      { opacity: 1; width: 46px; }
    }
  </style>
