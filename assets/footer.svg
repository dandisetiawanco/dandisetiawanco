<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 76" width="900" height="76" role="img" aria-labelledby="footer-title footer-desc">
  <title id="footer-title">Dandi Setiawan, Software Engineer &amp; AI Developer, Bandar Lampung, Indonesia</title>
  <desc id="footer-desc">Restrained personal signature footer matching the header palette and motion language.</desc>
  <defs>
    <linearGradient id="f-surface" x1="0" y1="0" x2="900" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#101A17" />
    </linearGradient>
    <linearGradient id="f-sheen" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    <clipPath id="f-clip">
      <rect x="0.75" y="0.75" width="898.5" height="74.5" rx="12" />
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    .f-glide {
      opacity: 0;
    }
    @media (prefers-reduced-motion: no-preference) {
      .f-glide {
        animation: footerGlide 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    }
    @keyframes footerGlide {
      0% { transform: translateX(-220px); opacity: 0; }
      15% { opacity: 0.75; }
      75% { opacity: 0.75; }
      92%, 100% { transform: translateX(910px); opacity: 0; }
    }
  </style>

  <g clip-path="url(#f-clip)">
    <rect x="0" y="0" width="900" height="76" fill="url(#f-surface)" />
    <rect class="f-glide" x="0" y="0.75" width="220" height="1.25" fill="url(#f-sheen)" />

    <text x="32" y="43" class="sans" font-size="14.5" font-weight="600" fill="#F0F6FC">
      Dandi Setiawan <tspan font-weight="400" fill="#9CA3AF"> ·  Software Engineer &amp; AI Developer</tspan>
    </text>
    <text x="868" y="43" text-anchor="end" class="sans" font-size="13.5" font-weight="400" fill="#9CA3AF">Bandar Lampung, Indonesia</text>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="74.5" rx="12" fill="none" stroke="#24352E" stroke-width="1.2" />
  <line x1="32" y1="0.75" x2="88" y2="0.75" stroke="#10B981" stroke-width="1.6" stroke-linecap="round" />
</svg>
