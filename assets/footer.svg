<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 112" width="1000" height="112" role="img" aria-labelledby="footer-title footer-desc">
  <title id="footer-title">Connect. Collaborate. Create. Dandi Setiawan, NGOPREK DIGITAL</title>
  <desc id="footer-desc">Animated emerald and deep navy architectural footer matching the hero banner.</desc>
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1000" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A151D" />
      <stop offset="50%" stop-color="#0F212D" />
      <stop offset="100%" stop-color="#0A151D" />
    </linearGradient>
    <linearGradient id="f-sweep" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    <clipPath id="f-clip">
      <rect x="1" y="1" width="998" height="110" rx="14" />
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    .serif-italic {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }
    .trace-base {
      fill: none;
      stroke: #1D3A47;
      stroke-width: 1.2;
      stroke-linecap: round;
    }
    .trace-left, .trace-right {
      fill: none;
      stroke: #34D399;
      stroke-width: 1.6;
      stroke-linecap: round;
    }
    @media (prefers-reduced-motion: no-preference) {
      .trace-left { stroke-dasharray: 42 260; animation: fLeft 5.8s linear infinite; }
      .trace-right { stroke-dasharray: 42 260; animation: fRight 5.8s linear infinite; }
      .f-bar { animation: fSweep 9s ease-in-out infinite; }
    }
    @keyframes fLeft { from { stroke-dashoffset: 302; } to { stroke-dashoffset: 0; } }
    @keyframes fRight { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 302; } }
    @keyframes fSweep {
      0% { transform: translateX(-240px); opacity: 0; }
      14% { opacity: 0.85; }
      86% { opacity: 0.85; }
      100% { transform: translateX(1020px); opacity: 0; }
    }
  </style>

  <g clip-path="url(#f-clip)">
    <rect x="0" y="0" width="1000" height="112" fill="url(#f-bg)" />
    <rect class="f-bar" x="0" y="109" width="220" height="2" fill="url(#f-sweep)" />

    <!-- Corner brackets -->
    <g stroke="#2B5B53" stroke-width="1.2" fill="none">
      <path d="M 16 26 L 16 14 L 28 14" />
      <path d="M 972 14 L 984 14 L 984 26" />
      <path d="M 16 86 L 16 98 L 28 98" />
      <path d="M 972 98 L 984 98 L 984 86" />
    </g>

    <!-- Symmetrical subtle circuit streams -->
    <g aria-hidden="true">
      <path class="trace-base" d="M 36 56 L 195 56 L 218 42 L 296 42" />
      <path class="trace-base" d="M 88 74 L 222 74 L 240 62 L 296 62" />
      <path class="trace-base" d="M 964 56 L 805 56 L 782 42 L 704 42" />
      <path class="trace-base" d="M 912 74 L 778 74 L 760 62 L 704 62" />

      <path class="trace-left" d="M 36 56 L 195 56 L 218 42 L 296 42" />
      <path class="trace-right" d="M 964 56 L 805 56 L 782 42 L 704 42" />

      <circle cx="296" cy="42" r="2.5" fill="#34D399" />
      <circle cx="704" cy="42" r="2.5" fill="#34D399" />
      <circle cx="296" cy="62" r="2.2" fill="#2B5B53" />
      <circle cx="704" cy="62" r="2.2" fill="#2B5B53" />
    </g>

    <text x="500" y="51" text-anchor="middle" class="serif-italic" font-size="22" fill="#F0F7F4">Connect. Collaborate. Create.</text>
    <text x="500" y="80" text-anchor="middle" class="sans" font-size="13" font-weight="500" fill="#A8C6BE">
      Dandi Setiawan  ·  <tspan fill="#5EEAD4">NGOPREK DIGITAL</tspan>  ·  Bandar Lampung, Indonesia
    </text>
  </g>

  <rect x="1" y="1" width="998" height="110" rx="14" fill="none" stroke="#1F424D" stroke-width="1.25" />
</svg>
