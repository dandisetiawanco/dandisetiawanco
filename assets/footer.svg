<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 68" width="900" height="68" role="img" aria-labelledby="f-t f-d">
  <title id="f-t">Dandi Setiawan, Software Architecture &amp; Applied AI</title>
  <desc id="f-d">Minimalist animated closing composition with horizon sweep.</desc>
  <defs>
    <linearGradient id="f-horizon" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#24352E" stop-opacity="1" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="f-pulse" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <clipPath id="f-line-clip">
      <rect x="0" y="6" width="900" height="6" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .f-sweep { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .f-sweep { animation: horizonPass 9s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .f-mark  { animation: barBreath 4.5s ease-in-out infinite; transform-origin: 450px 9px; }
    }
    @keyframes horizonPass {
      0% { transform: translateX(-180px); opacity: 0; }
      18%, 76% { opacity: 0.9; }
      95%, 100% { transform: translateX(920px); opacity: 0; }
    }
    @keyframes barBreath {
      0%, 100% { transform: scaleX(1); opacity: 0.85; }
      50%      { transform: scaleX(1.45); opacity: 1; }
    }
  </style>

  <line x1="0" y1="9" x2="900" y2="9" stroke="url(#f-horizon)" stroke-width="1" />
  <g clip-path="url(#f-line-clip)">
    <rect class="f-sweep" x="0" y="8.25" width="180" height="1.5" fill="url(#f-pulse)" />
  </g>
  <rect class="f-mark" x="426" y="8" width="48" height="2" rx="1" fill="#10B981" />

  <text x="16" y="44" class="sans" font-size="13.5" font-weight="600" fill="#F1F5F9" letter-spacing="-0.01em">Dandi Setiawan</text>
  <text x="450" y="44" text-anchor="middle" class="mono" font-size="11.5" fill="#34D399">Engineering  ·  AI Systems  ·  Architecture</text>
  <text x="884" y="44" text-anchor="end" class="mono" font-size="11.5" fill="#94A3B8">5.4292° S, 105.2610° E</text>
</svg>
