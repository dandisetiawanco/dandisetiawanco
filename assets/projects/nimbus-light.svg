<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 256" width="440" height="256" role="img" aria-labelledby="nm-tl nm-dl">
  <title id="nm-tl">NIMBUS CMS: Modular Content Management System</title>
  <desc id="nm-dl">Light-mode editorial publishing and Spatie RBAC workspace showcase for NIMBUS CMS.</desc>
  <defs>
    <linearGradient id="nm-bg-l" x1="0" y1="0" x2="440" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F6FAF8" />
    </linearGradient>
    <clipPath id="nm-clip-l">
      <rect x="0.75" y="0.75" width="438.5" height="254.5" rx="12" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .pub-pill { animation: pubPulse 7s ease-in-out infinite; }
      .doc-line { transform-origin: 34px 96px; animation: lineWrite 7s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .role-dot { animation: roleShift 7s ease-in-out infinite; }
    }
    @keyframes pubPulse {
      0%, 35%  { stroke: #CBD8D3; fill: #FFFFFF; }
      45%, 92% { stroke: #059669; fill: #ECFDF5; }
      100%     { stroke: #CBD8D3; fill: #FFFFFF; }
    }
    @keyframes lineWrite {
      0%, 15%  { transform: scaleX(0.45); opacity: 0.55; }
      45%, 92% { transform: scaleX(1); opacity: 1; }
      100%     { transform: scaleX(0.45); opacity: 0.55; }
    }
    @keyframes roleShift {
      0%, 40%  { fill: #94A3B8; }
      50%, 92% { fill: #059669; }
      100%     { fill: #94A3B8; }
    }
  </style>

  <g clip-path="url(#nm-clip-l)">
    <rect x="0" y="0" width="440" height="256" fill="url(#nm-bg-l)" />

    <rect x="18" y="18" width="404" height="128" rx="9" fill="#F8FBFA" stroke="#D5E2DD" stroke-width="1" />

    <rect x="28" y="28" width="248" height="20" rx="4" fill="#EAF2EE" />
    <text x="36" y="42" class="mono" font-size="9.5" font-weight="700" fill="#1E293B">B   I   H1   Link   Code</text>
    <text x="268" y="41" text-anchor="end" class="mono" font-size="9" font-weight="600" fill="#047857">Trix</text>

    <rect x="34" y="60" width="164" height="8" rx="3" fill="#0F1715" fill-opacity="0.78" />
    <rect x="34" y="76" width="228" height="5" rx="2.5" fill="#64748B" fill-opacity="0.35" />
    <rect x="34" y="88" width="208" height="5" rx="2.5" fill="#64748B" fill-opacity="0.35" />
    <rect class="doc-line" x="34" y="100" width="186" height="5" rx="2.5" fill="#059669" fill-opacity="0.8" />
    <text x="34" y="128" class="mono" font-size="9.5" fill="#566560">Slug: /engineering-architecture</text>

    <line x1="288" y1="26" x2="288" y2="138" stroke="#DCE6E2" stroke-width="1" />
    <text x="300" y="38" class="mono" font-size="9.5" fill="#566560">SPATIE RBAC</text>

    <circle cx="305" cy="56" r="3" fill="#059669" />
    <text x="314" y="59.5" class="sans" font-size="10.2" font-weight="500" fill="#0F1715">Admin · Full</text>

    <circle class="role-dot" cx="305" cy="76" r="3" fill="#059669" />
    <text x="314" y="79.5" class="sans" font-size="10.2" fill="#334155">Editor · Publish</text>

    <rect class="pub-pill" x="300" y="100" width="110" height="28" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1" />
    <text x="355" y="118" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#065F46">Published Live</text>

    <text x="22" y="175" class="sans" font-size="19" font-weight="700" fill="#0F1715" letter-spacing="-0.015em">NIMBUS CMS</text>
    <text x="418" y="174" text-anchor="end" class="mono" font-size="10.8" fill="#566560">dandisetiawanco/nimbus</text>
    <text x="22" y="200" class="sans" font-size="13" fill="#2E3A36">Modular publishing system with Trix editor and role permissions.</text>
    <line x1="22" y1="217" x2="418" y2="217" stroke="#DCE6E2" stroke-width="1" />
    <text x="22" y="237" class="mono" font-size="11" font-weight="600" fill="#047857">Laravel 12  ·  PHP 8.4  ·  Blade  ·  Tailwind CSS  ·  Alpine.js</text>
  </g>

  <rect x="0.75" y="0.75" width="438.5" height="254.5" rx="12" fill="none" stroke="#CBD8D3" stroke-width="1.2" />
</svg>
