<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 182" width="440" height="182" role="img" aria-labelledby="p-nim-tl p-nim-dl">
  <title id="p-nim-tl">NIMBUS CMS: Modular Content Management System</title>
  <desc id="p-nim-dl">Light-mode project card for NIMBUS CMS built with Laravel 12, PHP 8.4, Blade, Tailwind CSS, and Spatie Permissions.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <rect x="0.75" y="0.75" width="438.5" height="180.5" rx="12" fill="#FFFFFF" stroke="#D5E0DC" stroke-width="1.2" />

  <text x="24" y="34" class="mono" font-size="11" font-weight="600" fill="#047857">Modular backend</text>
  <text x="416" y="34" text-anchor="end" class="mono" font-size="11" fill="#566560">dandisetiawanco/nimbus</text>

  <text x="24" y="65" class="sans" font-size="19.5" font-weight="700" fill="#0F1715" letter-spacing="-0.015em">NIMBUS CMS</text>

  <text x="24" y="93" class="sans" font-size="13.3" fill="#2E3A36">Content management system built around modular publishing</text>
  <text x="24" y="113" class="sans" font-size="13.3" fill="#2E3A36">workflows, Trix rich-text authoring, and Spatie RBAC.</text>

  <line x1="24" y1="136" x2="416" y2="136" stroke="#DCE5E1" stroke-width="1" />
  <text x="24" y="159" class="mono" font-size="11.3" fill="#4B5854">Laravel 12  ·  PHP 8.4  ·  Blade  ·  Tailwind CSS  ·  Alpine.js</text>
</svg>
