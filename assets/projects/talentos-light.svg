<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 320" width="448" height="320" role="img" aria-labelledby="p-tos-t-light p-tos-d-light">
  <title id="p-tos-t-light">TalentOS: Recruitment Operating System Architecture</title>
  <desc id="p-tos-d-light">Full-stack recruitment operating system uniting evidence-first resume extraction, organization-isolated hiring workspaces, and structured human-led evaluation pipelines.</desc>
  <defs>
    <linearGradient id="tos-bg-light" x1="0" y1="0" x2="448" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <clipPath id="tos-clip-light">
      <rect x="0.75" y="0.75" width="446.5" height="318.5" rx="14" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .scan-bar { animation: docScan 4.6s ease-in-out infinite; }
      .pipe-flow { stroke-dasharray: 6 5; animation: pipeDash 1.9s linear infinite; }
      .stg-1 { animation: stgHi 6.6s ease-in-out 0s infinite; }
      .stg-2 { animation: stgHi 6.6s ease-in-out 2.2s infinite; }
      .stg-3 { animation: stgHi 6.6s ease-in-out 4.4s infinite; }
    }
    @keyframes docScan {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(46px); }
    }
    @keyframes pipeDash {
      from { stroke-dashoffset: 22; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes stgHi {
      0%, 28%   { stroke: #0891B2; fill: #ECFEFF; }
      38%, 100% { stroke: #CBD5E1; fill: #F1F5F9; }
    }
  </style>
  <g clip-path="url(#tos-clip-light)">
    <rect x="0" y="0" width="448" height="320" fill="url(#tos-bg-light)" />
    <rect x="0" y="0" width="448" height="3.5" fill="#7C3AED" />

    <!-- Top visual: Evidence-first resume parser & hiring pipeline -->
    <rect x="20" y="20" width="408" height="162" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" />
    <text x="34" y="41" class="mono" font-size="9.5" font-weight="700" fill="#6D28D9">RESUME EVIDENCE EXTRACTION</text>
    <text x="414" y="41" text-anchor="end" class="mono" font-size="9.2" fill="#475569">FASTAPI · NEXT.JS</text>
    <line x1="34" y1="50" x2="414" y2="50" stroke="#E2E8F0" stroke-width="1" />

    <!-- Left parsed document representation -->
    <rect x="34" y="62" width="110" height="66" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.15" />
    <rect x="44" y="73" width="54" height="5" rx="2" fill="#7C3AED" fill-opacity="0.85" />
    <rect x="44" y="85" width="88" height="4" rx="2" fill="#475569" fill-opacity="0.55" />
    <rect x="44" y="95" width="76" height="4" rx="2" fill="#475569" fill-opacity="0.55" />
    <rect x="44" y="105" width="82" height="4" rx="2" fill="#475569" fill-opacity="0.45" />
    <rect x="44" y="115" width="60" height="4" rx="2" fill="#0891B2" fill-opacity="0.7" />
    <rect class="scan-bar" x="37" y="70" width="104" height="2" rx="1" fill="#7C3AED" />

    <!-- Conduit to structured signals -->
    <line class="pipe-flow" x1="144" y1="95" x2="178" y2="95" stroke="#7C3AED" stroke-width="1.6" />

    <!-- Right structured candidate evaluation cards -->
    <rect x="178" y="62" width="236" height="66" rx="7" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.1" />
    <text x="190" y="79" class="mono" font-size="9.2" font-weight="700" fill="#0E7490">STRUCTURED SIGNALS</text>
    <text x="190" y="98" class="sans" font-size="11" font-weight="600" fill="#0F172A">Skills · Tenure · Role Match</text>
    <text x="190" y="115" class="mono" font-size="9.2" fill="#475569">Org-isolated recruiter review</text>

    <!-- Bottom 3-stage human-led hiring pipeline -->
    <rect class="stg-1" x="34" y="140" width="118" height="28" rx="6" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.15" />
    <text x="93" y="158" text-anchor="middle" class="mono" font-size="9.8" font-weight="600" fill="#0F172A">01 Screen</text>

    <line class="pipe-flow" x1="152" y1="154" x2="165" y2="154" stroke="#0891B2" stroke-width="1.5" />

    <rect class="stg-2" x="165" y="140" width="118" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.15" />
    <text x="224" y="158" text-anchor="middle" class="mono" font-size="9.8" font-weight="600" fill="#0F172A">02 Interview</text>

    <line class="pipe-flow" x1="283" y1="154" x2="296" y2="154" stroke="#0891B2" stroke-width="1.5" />

    <rect class="stg-3" x="296" y="140" width="118" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.15" />
    <text x="355" y="158" text-anchor="middle" class="mono" font-size="9.8" font-weight="600" fill="#0F172A">03 Decision</text>

    <!-- Bottom editorial specification -->
    <text x="22" y="208" class="mono" font-size="9.8" font-weight="600" fill="#6D28D9">04 / RECRUITMENT SYSTEMS</text>
    <text x="426" y="208" text-anchor="end" class="mono" font-size="9.8" fill="#475569">2026-11-25</text>
    <text x="22" y="236" class="sans" font-size="22" font-weight="700" fill="#0F172A" letter-spacing="-0.02em">TalentOS</text>
    <text x="22" y="260" class="sans" font-size="12.2" fill="#334155">Evidence-first resume extraction, candidate portals,</text>
    <text x="22" y="277" class="sans" font-size="12.2" fill="#334155">and human-led hiring pipelines.</text>
    <line x1="22" y1="291" x2="426" y2="291" stroke="#E2E8F0" stroke-width="1" />
    <text x="22" y="308" class="mono" font-size="10.2" font-weight="600" fill="#6D28D9">Next.js · TypeScript · FastAPI · PostgreSQL</text>
  </g>
  <rect x="0.75" y="0.75" width="446.5" height="318.5" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.2" />
</svg>
