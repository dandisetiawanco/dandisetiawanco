<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 198" width="900" height="198" role="img" aria-labelledby="p-aos-tl p-aos-dl">
  <title id="p-aos-tl">AgentOS: Open-Source Local-First Autonomous AI Desktop Assistant</title>
  <desc id="p-aos-dl">Light-mode flagship product card for AgentOS built with Tauri, React, FastAPI, LangGraph, and SQLite.</desc>
  <defs>
    <linearGradient id="aos-bg-l" x1="0" y1="0" x2="900" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F9F6" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <rect x="1" y="1" width="898" height="196" rx="14" fill="url(#aos-bg-l)" stroke="#C4DCD5" stroke-width="1.25" />

  <text x="30" y="38" class="mono" font-size="11.5" font-weight="600" fill="#046C4E">FLAGSHIP OPEN SOURCE  ·  RELEASED v0.1.0</text>
  <text x="30" y="72" class="sans" font-size="26" font-weight="700" fill="#173344" letter-spacing="-0.02em">AgentOS</text>

  <text x="30" y="102" class="sans" font-size="14" fill="#3B545C">Local-first autonomous AI desktop assistant that turns natural-language</text>
  <text x="30" y="122" class="sans" font-size="14" fill="#3B545C">instructions into structured plans, explicit permission gates, and verified actions.</text>

  <line x1="30" y1="146" x2="544" y2="146" stroke="#D6E5E1" stroke-width="1" />
  <text x="30" y="171" class="mono" font-size="12" fill="#4A656C">Python  ·  TypeScript  ·  Rust  ·  Tauri 2  ·  React  ·  FastAPI  ·  LangGraph  ·  SQLite</text>

  <rect x="572" y="24" width="298" height="150" rx="10" fill="#F7FAF9" stroke="#C4DCD5" stroke-width="1.1" />
  <text x="590" y="47" class="mono" font-size="11" fill="#4A656C">EXECUTION ARCHITECTURE</text>

  <rect x="590" y="60" width="122" height="32" rx="6" fill="#FFFFFF" stroke="#C4DCD5" stroke-width="1" />
  <text x="651" y="80" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#173344">1. Plan Graph</text>

  <path d="M 712 76 L 732 76" stroke="#057A55" stroke-width="1.5" />
  <polygon points="732,72 739,76 732,80" fill="#057A55" />

  <rect x="740" y="60" width="112" height="32" rx="6" fill="#E5F3EF" stroke="#83BCA8" stroke-width="1.1" />
  <text x="796" y="80" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#065F46">2. Approval</text>

  <path d="M 796 92 L 796 112" stroke="#057A55" stroke-width="1.5" />
  <polygon points="792,112 796,119 800,112" fill="#057A55" />

  <rect x="740" y="120" width="112" height="32" rx="6" fill="#FFFFFF" stroke="#C4DCD5" stroke-width="1" />
  <text x="796" y="140" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#173344">3. Sandbox Tool</text>

  <path d="M 740 136 L 720 136" stroke="#166270" stroke-width="1.5" />
  <polygon points="720,132 713,136 720,140" fill="#166270" />

  <rect x="590" y="120" width="122" height="32" rx="6" fill="#E5F3EF" stroke="#9FBAB4" stroke-width="1.1" />
  <text x="651" y="140" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#166270">4. Verified Result</text>
</svg>
