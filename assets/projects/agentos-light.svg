<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 196" width="900" height="196" role="img" aria-labelledby="p-aos-tl p-aos-dl">
  <title id="p-aos-tl">AgentOS: Local-First AI Desktop Assistant</title>
  <desc id="p-aos-dl">Light-mode flagship open-source project card for AgentOS built with Tauri 2, React, FastAPI, LangGraph, and SQLite.</desc>
  <defs>
    <linearGradient id="aos-bg-l" x1="0" y1="0" x2="900" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F6F9F8" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <rect x="0.75" y="0.75" width="898.5" height="194.5" rx="12" fill="url(#aos-bg-l)" stroke="#D5E0DC" stroke-width="1.2" />

  <text x="32" y="38" class="mono" font-size="11.5" font-weight="600" fill="#047857">Open-source desktop runtime  ·  v0.1.0</text>
  <text x="32" y="72" class="sans" font-size="25" font-weight="700" fill="#0F1715" letter-spacing="-0.02em">AgentOS</text>

  <text x="32" y="102" class="sans" font-size="13.8" fill="#2E3A36">Local-first AI desktop assistant that converts natural-language prompts</text>
  <text x="32" y="122" class="sans" font-size="13.8" fill="#2E3A36">into structured plans, permission-gated tool runs, and verified output.</text>

  <line x1="32" y1="146" x2="544" y2="146" stroke="#DCE5E1" stroke-width="1" />
  <text x="32" y="170" class="mono" font-size="11.5" fill="#4B5854">Python  ·  TypeScript  ·  Rust  ·  Tauri 2  ·  React  ·  FastAPI  ·  LangGraph  ·  SQLite</text>

  <rect x="572" y="24" width="296" height="148" rx="10" fill="#F6F9F8" stroke="#D5E0DC" stroke-width="1" />
  <text x="590" y="46" class="sans" font-size="11.5" font-weight="500" fill="#566560">Execution pipeline</text>

  <rect x="590" y="59" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#C8D6D1" stroke-width="1" />
  <text x="650" y="79" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#0F1715">1. Plan Graph</text>

  <path d="M 710 75 L 731 75" stroke="#059669" stroke-width="1.4" />
  <polygon points="731,71.5 737.5,75 731,78.5" fill="#059669" />

  <rect x="739" y="59" width="111" height="32" rx="6" fill="#ECFDF5" stroke="#059669" stroke-opacity="0.65" stroke-width="1" />
  <text x="794.5" y="79" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#065F46">2. Approval</text>

  <path d="M 794.5 91 L 794.5 111" stroke="#059669" stroke-width="1.4" />
  <polygon points="791,111 794.5,117.5 798,111" fill="#059669" />

  <rect x="739" y="119" width="111" height="32" rx="6" fill="#FFFFFF" stroke="#C8D6D1" stroke-width="1" />
  <text x="794.5" y="139" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#0F1715">3. Sandbox Tool</text>

  <path d="M 739 135 L 718 135" stroke="#047857" stroke-width="1.4" />
  <polygon points="718,131.5 711.5,135 718,138.5" fill="#047857" />

  <rect x="590" y="119" width="120" height="32" rx="6" fill="#ECFDF5" stroke="#059669" stroke-opacity="0.55" stroke-width="1" />
  <text x="650" y="139" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#047857">4. Verified Result</text>
</svg>
