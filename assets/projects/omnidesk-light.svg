<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 296" width="920" height="296" role="img" aria-labelledby="p-od-t-light p-od-d-light">
  <title id="p-od-t-light">OmniDesk: Cross-Platform AI Desktop Orchestration</title>
  <desc id="p-od-d-light">Cross-platform desktop AI operator bridging local Ollama and cloud model providers over authenticated loopback IPC with native adapters for macOS, Linux, and Windows.</desc>
  <defs>
    <linearGradient id="od-bg-light" x1="0" y1="0" x2="920" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <clipPath id="od-clip-light">
      <rect x="0.75" y="0.75" width="918.5" height="294.5" rx="14" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .ipc-flow { stroke-dasharray: 8 7; animation: ipcDash 1.9s linear infinite; }
      .os-1 { animation: osHi 7.5s ease-in-out 0s infinite; }
      .os-2 { animation: osHi 7.5s ease-in-out 2.5s infinite; }
      .os-3 { animation: osHi 7.5s ease-in-out 5.0s infinite; }
      .ipc-pkt { animation: ipcGlide 3.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    }
    @keyframes ipcDash {
      from { stroke-dashoffset: 30; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes osHi {
      0%, 28%   { stroke: #0891B2; fill: #ECFEFF; }
      38%, 100% { stroke: #CBD5E1; fill: #FFFFFF; }
    }
    @keyframes ipcGlide {
      0%   { transform: translateX(0px); opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateX(416px); opacity: 0; }
    }
  </style>
  <g clip-path="url(#od-clip-light)">
    <rect x="0" y="0" width="920" height="296" fill="url(#od-bg-light)" />
    <rect x="916" y="0" width="4" height="296" fill="#0891B2" />

    <!-- Left architectural orchestration topology (reversed composition from AgentOS) -->
    <rect x="26" y="22" width="504" height="252" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.15" />
    <text x="46" y="46" class="mono" font-size="10" font-weight="700" fill="#475569">HYBRID AI ROUTER &amp; OS ADAPTERS</text>
    <text x="510" y="46" text-anchor="end" class="mono" font-size="9.8" font-weight="600" fill="#0E7490">TAURI 2 SIDECAR</text>

    <!-- Tier 1: Dual AI Providers -->
    <rect x="46" y="60" width="218" height="48" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.2" />
    <text x="60" y="80" class="mono" font-size="9.5" font-weight="700" fill="#047857">LOCAL PROVIDER</text>
    <text x="60" y="97" class="sans" font-size="11.8" font-weight="600" fill="#0F172A">Ollama On-Device Models</text>

    <rect x="292" y="60" width="218" height="48" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2" />
    <text x="306" y="80" class="mono" font-size="9.5" font-weight="700" fill="#6D28D9">CLOUD PROVIDER</text>
    <text x="306" y="97" class="sans" font-size="11.8" font-weight="600" fill="#0F172A">External LLM Adapters</text>

    <!-- Downward conduits to Loopback IPC -->
    <line class="ipc-flow" x1="155" y1="108" x2="155" y2="136" stroke="#059669" stroke-width="1.7" />
    <line class="ipc-flow" x1="401" y1="108" x2="401" y2="136" stroke="#7C3AED" stroke-width="1.7" />

    <!-- Tier 2: Authenticated Loopback IPC Bus -->
    <rect x="46" y="136" width="464" height="44" rx="8" fill="#F1F5F9" stroke="#0891B2" stroke-width="1.35" />
    <text x="62" y="155" class="mono" font-size="10.2" font-weight="700" fill="#0E7490">AUTHENTICATED LOOPBACK IPC  ·  127.0.0.1</text>
    <text x="62" y="170" class="sans" font-size="10.5" fill="#334155">Rust native host bridge  ·  Python operator engine</text>
    <circle class="ipc-pkt" cx="62" cy="136" r="3.4" fill="#0891B2" />

    <!-- Downward conduits to 3 OS adapters -->
    <line class="ipc-flow" x1="118" y1="180" x2="118" y2="206" stroke="#0891B2" stroke-width="1.6" />
    <line class="ipc-flow" x1="278" y1="180" x2="278" y2="206" stroke="#0891B2" stroke-width="1.6" />
    <line class="ipc-flow" x1="438" y1="180" x2="438" y2="206" stroke="#0891B2" stroke-width="1.6" />

    <!-- Tier 3: Cross-platform adapters -->
    <rect class="os-1" x="46" y="206" width="144" height="50" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.2" />
    <text x="118" y="227" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#0F172A">macOS</text>
    <text x="118" y="244" text-anchor="middle" class="mono" font-size="9.2" fill="#475569">Native Adapter</text>

    <rect class="os-2" x="206" y="206" width="144" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="278" y="227" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#0F172A">Linux</text>
    <text x="278" y="244" text-anchor="middle" class="mono" font-size="9.2" fill="#475569">Native Adapter</text>

    <rect class="os-3" x="366" y="206" width="144" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="438" y="227" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#0F172A">Windows</text>
    <text x="438" y="244" text-anchor="middle" class="mono" font-size="9.2" fill="#475569">Native Adapter</text>

    <!-- Right editorial specification -->
    <text x="558" y="46" class="mono" font-size="10.2" font-weight="600" fill="#0E7490">02 / DESKTOP AI ORCHESTRATION  ·  1 star</text>
    <text x="558" y="84" class="sans" font-size="31" font-weight="700" fill="#0F172A" letter-spacing="-0.025em">OmniDesk</text>
    <text x="558" y="116" class="sans" font-size="13.2" fill="#334155">Cross-platform AI desktop agent turning natural</text>
    <text x="558" y="136" class="sans" font-size="13.2" fill="#334155">commands and user demonstrations into verified</text>
    <text x="558" y="156" class="sans" font-size="13.2" fill="#334155">workflows across macOS, Linux, and Windows.</text>

    <line x1="558" y1="184" x2="886" y2="184" stroke="#E2E8F0" stroke-width="1" />
    <text x="558" y="206" class="mono" font-size="9.8" font-weight="600" fill="#475569">CORE TECHNOLOGIES</text>
    <text x="558" y="228" class="mono" font-size="11" font-weight="600" fill="#0F172A">Rust  ·  Tauri 2  ·  Python  ·  React 19</text>
    <text x="558" y="248" class="mono" font-size="11" font-weight="600" fill="#0E7490">Ollama  ·  Cloud LLMs  ·  Sidecar IPC</text>

    <text x="558" y="274" class="mono" font-size="10.2" fill="#475569">github.com/dandisetiawanco/Omnidesk</text>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="294.5" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.2" />
</svg>
