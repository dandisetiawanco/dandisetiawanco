<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 256" width="440" height="256" role="img" aria-labelledby="nm-t nm-d">
  <title id="nm-t">NIMBUS CMS: Modular Content Management System</title>
  <desc id="nm-d">Editorial publishing and Spatie RBAC workspace showcase for NIMBUS CMS built with Laravel 12 and PHP 8.4.</desc>
  <defs>
    <linearGradient id="nm-bg" x1="0" y1="0" x2="440" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F14" />
      <stop offset="100%" stop-color="#0E1618" />
    </linearGradient>
    <clipPath id="nm-clip">
      <rect x="0.75" y="0.75" width="438.5" height="254.5" rx="12" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .pub-pill { animation: pubPulse 7s ease-in-out infinite; }
      .doc-line { transform-origin: 34px 96px; animation: lineWrite 7s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .role-dot { animation: roleShift 7s ease-in-out infinite; }
    }
    @keyframes pubPulse {
      0%, 35%  { stroke: #283B3A; fill: #131E22; }
      45%, 92% { stroke: #10B981; fill: #122922; }
      100%     { stroke: #283B3A; fill: #131E22; }
    }
    @keyframes lineWrite {
      0%, 15%  { transform: scaleX(0.45); opacity: 0.65; }
      45%, 92% { transform: scaleX(1); opacity: 1; }
      100%     { transform: scaleX(0.45); opacity: 0.65; }
    }
    @keyframes roleShift {
      0%, 40%  { fill: #94A3B8; }
      50%, 92% { fill: #34D399; }
      100%     { fill: #94A3B8; }
    }
  </style>

  <g clip-path="url(#nm-clip)">
    <rect x="0" y="0" width="440" height="256" fill="url(#nm-bg)" />

    <!-- Upper Product UI: Trix Rich-Text Canvas & Spatie RBAC Governance -->
    <rect x="18" y="18" width="404" height="128" rx="9" fill="#111820" stroke="#1E2C32" stroke-width="1" />

    <!-- Trix Editor Toolbar -->
    <rect x="28" y="28" width="248" height="20" rx="4" fill="#16202A" />
    <text x="36" y="42" class="mono" font-size="9.5" font-weight="700" fill="#E2E8F0">B   I   H1   Link   Code</text>
    <text x="268" y="41" text-anchor="end" class="mono" font-size="9" fill="#34D399">Trix</text>

    <!-- Structured Document Blocks -->
    <rect x="34" y="60" width="164" height="8" rx="3" fill="#E2E8F0" fill-opacity="0.82" />
    <rect x="34" y="76" width="228" height="5" rx="2.5" fill="#94A3B8" fill-opacity="0.45" />
    <rect x="34" y="88" width="208" height="5" rx="2.5" fill="#94A3B8" fill-opacity="0.45" />
    <rect class="doc-line" x="34" y="100" width="186" height="5" rx="2.5" fill="#34D399" fill-opacity="0.78" />
    <text x="34" y="128" class="mono" font-size="9.5" fill="#94A3B8">Slug: /engineering-architecture</text>

    <!-- Right RBAC & Publish Inspector -->
    <line x1="288" y1="26" x2="288" y2="138" stroke="#1E2B32" stroke-width="1" />
    <text x="300" y="38" class="mono" font-size="9.5" fill="#94A3B8">SPATIE RBAC</text>

    <circle cx="305" cy="56" r="3" fill="#34D399" />
    <text x="314" y="59.5" class="sans" font-size="10.2" fill="#E2E8F0">Admin · Full</text>

    <circle class="role-dot" cx="305" cy="76" r="3" fill="#34D399" />
    <text x="314" y="79.5" class="sans" font-size="10.2" fill="#CBD5E1">Editor · Publish</text>

    <rect class="pub-pill" x="300" y="100" width="110" height="28" rx="5" fill="#122922" stroke="#10B981" stroke-width="1" />
    <text x="355" y="118" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#34D399">Published Live</text>

    <!-- Lower Project Metadata -->
    <text x="22" y="175" class="sans" font-size="19" font-weight="700" fill="#F8FAFC" letter-spacing="-0.015em">NIMBUS CMS</text>
    <text x="418" y="174" text-anchor="end" class="mono" font-size="10.8" fill="#94A3B8">dandisetiawanco/nimbus</text>
    <text x="22" y="200" class="sans" font-size="13" fill="#CBD5E1">Modular publishing system with Trix editor and role permissions.</text>
    <line x1="22" y1="217" x2="418" y2="217" stroke="#1C2A26" stroke-width="1" />
    <text x="22" y="237" class="mono" font-size="11" fill="#34D399">Laravel 12  ·  PHP 8.4  ·  Blade  ·  Tailwind CSS  ·  Alpine.js</text>
  </g>

  <rect x="0.75" y="0.75" width="438.5" height="254.5" rx="12" fill="none" stroke="#23342E" stroke-width="1.2" />
</svg>
