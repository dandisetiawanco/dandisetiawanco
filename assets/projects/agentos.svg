<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 304" width="900" height="304" role="img" aria-labelledby="aos-t aos-d">
  <title id="aos-t">AgentOS: Local-First AI Desktop Assistant</title>
  <desc id="aos-d">Flagship product showcase for AgentOS featuring its macOS desktop workspace and animated Plan, Approval, Execution, and Verification pipeline.</desc>
  <defs>
    <linearGradient id="aos-canvas" x1="0" y1="0" x2="900" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0E14" />
      <stop offset="65%" stop-color="#0D1318" />
      <stop offset="100%" stop-color="#0F1B17" />
    </linearGradient>
    <linearGradient id="win-bg" x1="392" y1="22" x2="874" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111820" />
      <stop offset="100%" stop-color="#0B1015" />
    </linearGradient>
    <linearGradient id="exec-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <clipPath id="aos-clip">
      <rect x="0.75" y="0.75" width="898.5" height="302.5" rx="14" />
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

    /* Static readable default */
    .exec-prog { transform-origin: 518px 206px; transform: scaleX(1); }

    @media (prefers-reduced-motion: no-preference) {
      .st-1 { animation: stepGlow1 9.6s ease-in-out infinite; }
      .st-2 { animation: stepGlow2 9.6s ease-in-out infinite; }
      .st-3 { animation: stepGlow3 9.6s ease-in-out infinite; }
      .st-4 { animation: stepGlow4 9.6s ease-in-out infinite; }

      .conn-flow { stroke-dasharray: 14 10; animation: dashMove 1.6s linear infinite; }
      .exec-prog { animation: fillExec 9.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }

      .card-p1 { animation: cardFocus1 9.6s ease-in-out infinite; }
      .card-p2 { animation: cardFocus2 9.6s ease-in-out infinite; }
      .card-p3 { animation: cardFocus3 9.6s ease-in-out infinite; }
      .card-p4 { animation: cardFocus4 9.6s ease-in-out infinite; }
    }

    @keyframes dashMove {
      from { stroke-dashoffset: 24; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes stepGlow1 {
      0%, 22%  { stroke: #34D399; fill: #122821; }
      28%, 100%{ stroke: #23352F; fill: #0F171A; }
    }
    @keyframes stepGlow2 {
      0%, 23%  { stroke: #23352F; fill: #0F171A; }
      26%, 47% { stroke: #34D399; fill: #122821; }
      53%, 100%{ stroke: #23352F; fill: #0F171A; }
    }
    @keyframes stepGlow3 {
      0%, 48%  { stroke: #23352F; fill: #0F171A; }
      51%, 72% { stroke: #34D399; fill: #122821; }
      78%, 100%{ stroke: #23352F; fill: #0F171A; }
    }
    @keyframes stepGlow4 {
      0%, 73%  { stroke: #23352F; fill: #0F171A; }
      76%, 97% { stroke: #34D399; fill: #122821; }
      100%     { stroke: #23352F; fill: #0F171A; }
    }

    @keyframes cardFocus1 {
      0%, 22%  { stroke: #10B981; stroke-width: 1.4; }
      28%, 100%{ stroke: #1F2D35; stroke-width: 1; }
    }
    @keyframes cardFocus2 {
      0%, 23%  { stroke: #1F2D35; stroke-width: 1; }
      26%, 47% { stroke: #10B981; stroke-width: 1.4; }
      53%, 100%{ stroke: #1F2D35; stroke-width: 1; }
    }
    @keyframes cardFocus3 {
      0%, 48%  { stroke: #1F2D35; stroke-width: 1; }
      51%, 72% { stroke: #10B981; stroke-width: 1.4; }
      78%, 100%{ stroke: #1F2D35; stroke-width: 1; }
    }
    @keyframes cardFocus4 {
      0%, 73%  { stroke: #1F2D35; stroke-width: 1; }
      76%, 97% { stroke: #34D399; stroke-width: 1.4; }
      100%     { stroke: #1F2D35; stroke-width: 1; }
    }
    @keyframes fillExec {
      0%, 48%  { transform: scaleX(0.18); opacity: 0.45; }
      68%, 96% { transform: scaleX(1); opacity: 1; }
      100%     { transform: scaleX(0.18); opacity: 0.45; }
    }
  </style>

  <g clip-path="url(#aos-clip)">
    <rect x="0" y="0" width="900" height="304" fill="url(#aos-canvas)" />

    <!-- Left Product Narrative & Synchronized Pipeline -->
    <text x="32" y="42" class="mono" font-size="11" font-weight="600" fill="#34D399">Flagship Open Source  ·  v0.1.0</text>
    <text x="32" y="80" class="sans" font-size="30" font-weight="700" fill="#F8FAFC" letter-spacing="-0.025em">AgentOS</text>

    <text x="32" y="110" class="sans" font-size="13.5" fill="#CBD5E1">Local-first AI desktop assistant turning natural-language</text>
    <text x="32" y="130" class="sans" font-size="13.5" fill="#CBD5E1">instructions into explicit plans, approval gates, and</text>
    <text x="32" y="150" class="sans" font-size="13.5" fill="#CBD5E1">verifiable computer actions.</text>

    <!-- Animated 4-Stage Pipeline Strip (Plan -> Approval -> Execution -> Verification) -->
    <text x="32" y="182" class="mono" font-size="10.5" fill="#94A3B8">ORCHESTRATION PIPELINE</text>

    <!-- Moving connector track -->
    <line x1="68" y1="208" x2="328" y2="208" stroke="#1E2E29" stroke-width="1.5" />
    <line class="conn-flow" x1="68" y1="208" x2="328" y2="208" stroke="#10B981" stroke-width="1.5" />

    <rect class="st-1" x="32" y="194" width="68" height="28" rx="6" fill="#122821" stroke="#34D399" stroke-width="1.2" />
    <text x="66" y="212" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#F8FAFC">Plan</text>

    <rect class="st-2" x="112" y="194" width="76" height="28" rx="6" fill="#0F171A" stroke="#23352F" stroke-width="1.2" />
    <text x="150" y="212" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#F8FAFC">Approval</text>

    <rect class="st-3" x="200" y="194" width="78" height="28" rx="6" fill="#0F171A" stroke="#23352F" stroke-width="1.2" />
    <text x="239" y="212" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#F8FAFC">Execution</text>

    <rect class="st-4" x="290" y="194" width="80" height="28" rx="6" fill="#0F171A" stroke="#23352F" stroke-width="1.2" />
    <text x="330" y="212" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#F8FAFC">Verify</text>

    <line x1="32" y1="246" x2="366" y2="246" stroke="#1B2825" stroke-width="1" />
    <text x="32" y="268" class="mono" font-size="10.4" fill="#94A3B8">Tauri 2 · Rust · React · FastAPI · LangGraph · SQLite</text>

    <!-- Right-side AgentOS Native macOS Liquid Glass Desktop Interface -->
    <rect x="392" y="22" width="480" height="260" rx="10" fill="url(#win-bg)" stroke="#263833" stroke-width="1.2" />

    <!-- macOS Window Chrome -->
    <rect x="392" y="22" width="480" height="28" rx="10" fill="#141D24" />
    <line x1="392" y1="50" x2="872" y2="50" stroke="#1E2B33" stroke-width="1" />
    <circle cx="408" cy="36" r="3.8" fill="#334155" />
    <circle cx="420" cy="36" r="3.8" fill="#334155" />
    <circle cx="432" cy="36" r="3.8" fill="#334155" />
    <text x="632" y="40" text-anchor="middle" class="sans" font-size="10.8" font-weight="500" fill="#94A3B8">AgentOS  ·  Workspace</text>
    <text x="858" y="40" text-anchor="end" class="mono" font-size="9.8" fill="#34D399">FastAPI Ready</text>

    <!-- Translucent Frosted Sidebar -->
    <rect x="393" y="51" width="106" height="230" fill="#0E151B" />
    <line x1="499" y1="50" x2="499" y2="282" stroke="#1D2A32" stroke-width="1" />
    <text x="407" y="74" class="sans" font-size="10.5" fill="#94A3B8">Overview</text>
    <rect x="401" y="84" width="90" height="22" rx="5" fill="#132922" />
    <text x="409" y="99" class="sans" font-size="10.5" font-weight="600" fill="#34D399">Assistant</text>
    <text x="407" y="123" class="sans" font-size="10.5" fill="#94A3B8">Approvals</text>
    <text x="407" y="145" class="sans" font-size="10.5" fill="#94A3B8">Audit Log</text>
    <text x="407" y="167" class="sans" font-size="10.5" fill="#94A3B8">Settings</text>

    <!-- Workspace Main Panel: 4 Coordinated Runtime Cards -->
    <!-- 1. Plan Graph Card -->
    <rect class="card-p1" x="512" y="62" width="346" height="44" rx="7" fill="#121A22" stroke="#1F2D35" stroke-width="1" />
    <text x="524" y="80" class="mono" font-size="10" font-weight="600" fill="#34D399">01 · PLAN GRAPH</text>
    <text x="846" y="80" text-anchor="end" class="mono" font-size="9.8" fill="#94A3B8">LangGraph · 3 nodes</text>
    <text x="524" y="96" class="sans" font-size="11" fill="#E2E8F0">Inspect project tree, run test suite, verify exit code</text>

    <!-- 2. Permission Approval Gate -->
    <rect class="card-p2" x="512" y="114" width="346" height="44" rx="7" fill="#121A22" stroke="#1F2D35" stroke-width="1" />
    <text x="524" y="132" class="mono" font-size="10" font-weight="600" fill="#34D399">02 · PERMISSION GATE</text>
    <rect x="786" y="121" width="60" height="16" rx="4" fill="#112A22" stroke="#10B981" stroke-width="0.9" />
    <text x="816" y="132" text-anchor="middle" class="mono" font-size="9.2" font-weight="600" fill="#34D399">Approved</text>
    <text x="524" y="148" class="sans" font-size="11" fill="#CBD5E1">Scoped read/test execution inside workspace boundary</text>

    <!-- 3. Sandbox Tool Execution -->
    <rect class="card-p3" x="512" y="166" width="346" height="50" rx="7" fill="#121A22" stroke="#1F2D35" stroke-width="1" />
    <text x="524" y="184" class="mono" font-size="10" font-weight="600" fill="#34D399">03 · TOOL EXECUTION</text>
    <text x="846" y="184" text-anchor="end" class="mono" font-size="9.8" fill="#CBD5E1">pytest · vitest</text>
    <rect x="524" y="196" width="322" height="6" rx="3" fill="#1B2730" />
    <rect class="exec-prog" x="524" y="196" width="322" height="6" rx="3" fill="url(#exec-bar)" />

    <!-- 4. Verification & SQLite Audit -->
    <rect class="card-p4" x="512" y="224" width="346" height="44" rx="7" fill="#10211C" stroke="#244238" stroke-width="1" />
    <text x="524" y="242" class="mono" font-size="10" font-weight="600" fill="#34D399">04 · VERIFICATION</text>
    <text x="846" y="242" text-anchor="end" class="mono" font-size="9.8" fill="#34D399">SQLite Logged</text>
    <text x="524" y="258" class="sans" font-size="11" fill="#E2E8F0">All checks passed (exit 0) · Action trace persisted</text>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="302.5" rx="14" fill="none" stroke="#24352E" stroke-width="1.2" />
</svg>
