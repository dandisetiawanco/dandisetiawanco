<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 198" width="900" height="198" role="img" aria-labelledby="p-aos-t p-aos-d">
  <title id="p-aos-t">AgentOS: Open-Source Local-First Autonomous AI Desktop Assistant</title>
  <desc id="p-aos-d">Flagship product card for AgentOS built with Tauri, React, FastAPI, LangGraph, and SQLite.</desc>
  <defs>
    <linearGradient id="aos-bg" x1="0" y1="0" x2="900" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1C26" />
      <stop offset="100%" stop-color="#112731" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <rect x="1" y="1" width="898" height="196" rx="14" fill="url(#aos-bg)" stroke="#235059" stroke-width="1.25" />

  <!-- Left Content -->
  <text x="30" y="38" class="mono" font-size="11.5" font-weight="600" fill="#34D399">FLAGSHIP OPEN SOURCE  ·  RELEASED v0.1.0</text>
  <text x="30" y="72" class="sans" font-size="26" font-weight="700" fill="#F0F7F4" letter-spacing="-0.02em">AgentOS</text>

  <text x="30" y="102" class="sans" font-size="14" fill="#C4DED6">Local-first autonomous AI desktop assistant that turns natural-language</text>
  <text x="30" y="122" class="sans" font-size="14" fill="#C4DED6">instructions into structured plans, explicit permission gates, and verified actions.</text>

  <line x1="30" y1="146" x2="544" y2="146" stroke="#1E3C48" stroke-width="1" />
  <text x="30" y="171" class="mono" font-size="12" fill="#92B8AE">Python  ·  TypeScript  ·  Rust  ·  Tauri 2  ·  React  ·  FastAPI  ·  LangGraph  ·  SQLite</text>

  <!-- Right Minimalist Architecture Pipeline Diagram -->
  <rect x="572" y="24" width="298" height="150" rx="10" fill="#09131B" stroke="#1D3A47" stroke-width="1" />
  <text x="590" y="47" class="mono" font-size="11" fill="#8CB3A9">EXECUTION ARCHITECTURE</text>

  <!-- Step Nodes -->
  <rect x="590" y="60" width="122" height="32" rx="6" fill="#122632" stroke="#254C59" stroke-width="1" />
  <text x="651" y="80" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#F0F7F4">1. Plan Graph</text>

  <path d="M 712 76 L 732 76" stroke="#34D399" stroke-width="1.5" />
  <polygon points="732,72 739,76 732,80" fill="#34D399" />

  <rect x="740" y="60" width="112" height="32" rx="6" fill="#133330" stroke="#34D399" stroke-opacity="0.7" stroke-width="1" />
  <text x="796" y="80" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#34D399">2. Approval</text>

  <path d="M 796 92 L 796 112" stroke="#34D399" stroke-width="1.5" />
  <polygon points="792,112 796,119 800,112" fill="#34D399" />

  <rect x="740" y="120" width="112" height="32" rx="6" fill="#122632" stroke="#254C59" stroke-width="1" />
  <text x="796" y="140" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#F0F7F4">3. Sandbox Tool</text>

  <path d="M 740 136 L 720 136" stroke="#5EEAD4" stroke-width="1.5" />
  <polygon points="720,132 713,136 720,140" fill="#5EEAD4" />

  <rect x="590" y="120" width="122" height="32" rx="6" fill="#102E2C" stroke="#5EEAD4" stroke-opacity="0.65" stroke-width="1" />
  <text x="651" y="140" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#5EEAD4">4. Verified Result</text>
</svg>
