<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 182" width="440" height="182" role="img" aria-labelledby="p-nexa-tl p-nexa-dl">
  <title id="p-nexa-tl">NEXA POS: Store Management &amp; Point of Sale</title>
  <desc id="p-nexa-dl">Light-mode project card for NEXA POS built with Laravel 12, React, Sanctum, Tailwind CSS, and MySQL.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <rect x="0.75" y="0.75" width="438.5" height="180.5" rx="12" fill="#FFFFFF" stroke="#D5E0DC" stroke-width="1.2" />

  <text x="24" y="34" class="mono" font-size="11" font-weight="600" fill="#047857">Full-stack web</text>
  <text x="416" y="34" text-anchor="end" class="mono" font-size="11" fill="#566560">dandisetiawanco/nexapos</text>

  <text x="24" y="65" class="sans" font-size="19.5" font-weight="700" fill="#0F1715" letter-spacing="-0.015em">NEXA POS</text>

  <text x="24" y="93" class="sans" font-size="13.3" fill="#2E3A36">Store operations and point-of-sale platform with role-based</text>
