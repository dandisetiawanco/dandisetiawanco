  <line x1="24" y1="136" x2="416" y2="136" stroke="#DCE5E1" stroke-width="1" />
  <text x="24" y="159" class="mono" font-size="11.3" fill="#4B5854">Laravel 12  ·  React  ·  Tailwind CSS  ·  Sanctum  ·  MySQL</text>
