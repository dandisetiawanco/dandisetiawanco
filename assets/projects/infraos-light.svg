<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="920" height="210" role="img" aria-labelledby="p-inf-t-light p-inf-d-light">
  <title id="p-inf-t-light">InfraOS: Infrastructure Operations &amp; Observability Platform</title>
  <desc id="p-inf-d-light">Infrastructure operations control plane combining Go telemetry collectors, Prometheus metrics, Terraform provisioning modules, and controlled deployment workflows.</desc>
  <defs>
    <linearGradient id="inf-bg-light" x1="0" y1="0" x2="920" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <clipPath id="inf-clip-light">
      <rect x="0.75" y="0.75" width="918.5" height="208.5" rx="14" />
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .wave-hi { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .wave-hi { opacity: 1; stroke-dasharray: 84 520; animation: waveTrace 4.8s linear infinite; }
      .roll-line { stroke-dasharray: 8 6; animation: rollMove 2.0s linear infinite; }
    }
    @keyframes waveTrace {
      0%   { stroke-dashoffset: 604; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rollMove {
      from { stroke-dashoffset: 28; }
      to   { stroke-dashoffset: 0; }
    }
  </style>
  <g clip-path="url(#inf-clip-light)">
    <rect x="0" y="0" width="920" height="210" fill="url(#inf-bg-light)" />
    <rect x="0" y="0" width="4" height="210" fill="#0891B2" />

    <!-- Left compact horizontal editorial info -->
    <text x="32" y="38" class="mono" font-size="10" font-weight="600" fill="#0E7490">05 / INFRASTRUCTURE &amp; OBSERVABILITY</text>
    <text x="32" y="72" class="sans" font-size="26" font-weight="700" fill="#0F172A" letter-spacing="-0.02em">InfraOS</text>
    <text x="32" y="100" class="sans" font-size="12.5" fill="#334155">Go control plane unifying host telemetry, Prometheus</text>
    <text x="32" y="118" class="sans" font-size="12.5" fill="#334155">observability, Terraform modules, and rollout control.</text>
    <line x1="32" y1="140" x2="360" y2="140" stroke="#E2E8F0" stroke-width="1" />
    <text x="32" y="162" class="mono" font-size="10.5" font-weight="600" fill="#0E7490">Go · Next.js · Prometheus · Terraform · Docker</text>
    <text x="32" y="184" class="mono" font-size="9.8" fill="#475569">dandisetiawanco/InfraOS  ·  2026-11-25</text>

    <!-- Right telemetry & deployment panel -->
    <rect x="392" y="20" width="502" height="170" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" />
    <text x="412" y="42" class="mono" font-size="9.5" font-weight="700" fill="#475569">SERVICE TELEMETRY WAVEFORM</text>
    <text x="874" y="42" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#047857">GO WORKER · PROMETHEUS</text>

    <!-- Waveform baseline + animated pulse -->
    <line x1="412" y1="88" x2="874" y2="88" stroke="#E2E8F0" stroke-width="1" />
    <path d="M 412 88 L 448 88 L 464 62 L 480 96 L 496 74 L 520 88 L 562 88 L 578 56 L 594 94 L 612 72 L 636 88 L 684 88 L 702 64 L 718 92 L 736 76 L 764 88 L 812 88 L 828 60 L 844 92 L 866 88" fill="none" stroke="#0891B2" stroke-opacity="0.32" stroke-width="1.8" stroke-linejoin="round" />
    <path class="wave-hi" pathLength="604" d="M 412 88 L 448 88 L 464 62 L 480 96 L 496 74 L 520 88 L 562 88 L 578 56 L 594 94 L 612 72 L 636 88 L 684 88 L 702 64 L 718 92 L 736 76 L 764 88 L 812 88 L 828 60 L 844 92 L 866 88" fill="none" stroke="#0891B2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Deployment rollout pipeline -->
    <line x1="412" y1="116" x2="874" y2="116" stroke="#E2E8F0" stroke-width="1" />
    <line class="roll-line" x1="470" y1="152" x2="816" y2="152" stroke="#059669" stroke-width="1.7" />

    <rect x="412" y="134" width="128" height="36" rx="7" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.15" />
    <text x="476" y="156" text-anchor="middle" class="mono" font-size="10.2" font-weight="600" fill="#0F172A">Go Telemetry</text>

    <rect x="578" y="134" width="130" height="36" rx="7" fill="#F1F5F9" stroke="#D97706" stroke-width="1.15" />
    <text x="643" y="156" text-anchor="middle" class="mono" font-size="10.2" font-weight="600" fill="#B45309">Terraform HCL</text>

    <rect x="746" y="134" width="128" height="36" rx="7" fill="#ECFDF5" stroke="#059669" stroke-width="1.15" />
    <text x="810" y="156" text-anchor="middle" class="mono" font-size="10.2" font-weight="600" fill="#047857">Safe Rollout</text>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="208.5" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.2" />
</svg>
