<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 304" width="900" height="304" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">Dandi Setiawan: Software Engineer &amp; AI Developer, Bandar Lampung, Indonesia</title>
  <desc id="hero-d">Animated editorial portfolio header featuring masked typography reveals, rotating engineering specialties, and layered architectural geometry.</desc>
  <defs>
    <linearGradient id="h-canvas" x1="0" y1="0" x2="900" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D12" />
      <stop offset="55%" stop-color="#0D1318" />
      <stop offset="100%" stop-color="#0F1916" />
    </linearGradient>
    <radialGradient id="h-atmo" cx="716" cy="148" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="52%" stop-color="#059669" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#090D12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="plane-a" x1="560" y1="36" x2="830" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162420" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0D1418" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="plane-b" x1="600" y1="64" x2="852" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D332C" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#101B18" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="plane-c" x1="642" y1="92" x2="844" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#132620" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="emerald-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#24352E" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="beam-sweep" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>

    <clipPath id="outer-clip">
      <rect x="0.75" y="0.75" width="898.5" height="302.5" rx="14" />
    </clipPath>
    <clipPath id="mask-name">
      <rect x="48" y="54" width="500" height="68" />
    </clipPath>
    <clipPath id="mask-role">
      <rect x="48" y="124" width="480" height="34" />
    </clipPath>
    <clipPath id="mask-rotator">
      <rect x="64" y="176" width="360" height="28" />
    </clipPath>
    <clipPath id="mask-loc">
      <rect x="48" y="232" width="380" height="28" />
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

    /* Readable static / reduced-motion baseline */
    .rot-1 { opacity: 1; transform: translateY(0); }
    .rot-2, .rot-3, .rot-4 { opacity: 0; transform: translateY(22px); }
    .prog-fill { transform-origin: 48px 214px; transform: scaleX(1); }
    .top-beam { opacity: 0; }

    @media (prefers-reduced-motion: no-preference) {
      .rev-name { animation: maskRise 0.82s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both; }
      .rev-role { animation: maskRise 0.78s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both; }
      .rev-loc  { animation: maskRise 0.78s cubic-bezier(0.16, 1, 0.3, 1) 0.34s both; }
      .rule-draw { transform-origin: 48px 168px; animation: scaleInX 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.24s both; }

      .rot-1 { animation: slot1 12s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .rot-2 { animation: slot2 12s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .rot-3 { animation: slot3 12s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .rot-4 { animation: slot4 12s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .prog-fill { animation: slotProgress 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

      .layer-back  { transform-origin: 716px 152px; animation: floatBack 11s ease-in-out infinite; }
      .layer-mid   { transform-origin: 716px 152px; animation: floatMid 9s ease-in-out infinite; }
      .layer-front { transform-origin: 716px 152px; animation: floatFront 7.5s ease-in-out infinite; }
      .accent-arc  { stroke-dasharray: 96 320; animation: arcGlide 8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .atmo-glow   { animation: atmoBreathe 10s ease-in-out infinite; }
      .top-beam    { animation: beamPass 10s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    }

    @keyframes maskRise {
      from { opacity: 0; transform: translateY(34px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleInX {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    @keyframes slot1 {
      0%, 20%   { opacity: 1; transform: translateY(0px); }
      24%, 95%  { opacity: 0; transform: translateY(-22px); }
      96%       { opacity: 0; transform: translateY(22px); }
      100%      { opacity: 1; transform: translateY(0px); }
    }
    @keyframes slot2 {
      0%, 21%   { opacity: 0; transform: translateY(22px); }
      25%, 45%  { opacity: 1; transform: translateY(0px); }
      49%, 100% { opacity: 0; transform: translateY(-22px); }
    }
    @keyframes slot3 {
      0%, 46%   { opacity: 0; transform: translateY(22px); }
      50%, 70%  { opacity: 1; transform: translateY(0px); }
      74%, 100% { opacity: 0; transform: translateY(-22px); }
    }
    @keyframes slot4 {
      0%, 71%   { opacity: 0; transform: translateY(22px); }
      75%, 95%  { opacity: 1; transform: translateY(0px); }
      99%, 100% { opacity: 0; transform: translateY(-22px); }
    }
    @keyframes slotProgress {
      0%   { transform: scaleX(0.08); opacity: 0.55; }
      82%  { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(0.08); opacity: 0.35; }
    }

    @keyframes floatBack {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50%      { transform: translate(-10px, 7px) rotate(-1.4deg); }
    }
    @keyframes floatMid {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50%      { transform: translate(9px, -9px) rotate(1.6deg); }
    }
    @keyframes floatFront {
      0%, 100% { transform: translate(0px, 0px); }
      50%      { transform: translate(-6px, -11px); }
    }
    @keyframes arcGlide {
      0%   { stroke-dashoffset: 416; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes atmoBreathe {
      0%, 100% { opacity: 0.78; transform: translate(0px, 0px); }
      50%      { opacity: 1; transform: translate(-18px, 8px); }
    }
    @keyframes beamPass {
      0%        { transform: translateX(-220px); opacity: 0; }
      15%, 75%  { opacity: 0.9; }
      92%, 100% { transform: translateX(920px); opacity: 0; }
    }
  </style>

  <g clip-path="url(#outer-clip)">
    <rect x="0" y="0" width="900" height="304" fill="url(#h-canvas)" />
    <rect class="atmo-glow" x="400" y="-20" width="520" height="340" fill="url(#h-atmo)" />

    <!-- Subtle architectural perspective hairlines anchoring right composition -->
    <line x1="528" y1="0" x2="528" y2="304" stroke="#182226" stroke-width="1" />
    <line x1="528" y1="152" x2="900" y2="152" stroke="#16211F" stroke-width="1" />
    <rect class="top-beam" x="0" y="0.75" width="220" height="1.5" fill="url(#beam-sweep)" />

    <!-- Right-side abstract architectural layered composition -->
    <g aria-hidden="true">
      <!-- Back monolithic sheared plane -->
      <g class="layer-back">
        <polygon points="612,46 838,76 806,246 580,216" fill="url(#plane-a)" stroke="#233630" stroke-width="1.1" />
        <line x1="612" y1="46" x2="806" y2="246" stroke="#1C2D28" stroke-width="1" />
      </g>

      <!-- Middle counter-angled architectural slab -->
      <g class="layer-mid">
        <polygon points="586,96 798,58 836,214 624,252" fill="url(#plane-b)" stroke="#2C493F" stroke-width="1.15" />
        <path class="accent-arc" d="M 586 96 L 798 58 L 836 214 L 624 252 Z" fill="none" stroke="#34D399" stroke-width="1.5" />
      </g>

      <!-- Foreground emerald-faceted focal prism -->
      <g class="layer-front">
        <polygon points="648,104 824,104 792,204 616,204" fill="url(#plane-c)" stroke="url(#emerald-edge)" stroke-width="1.35" />
        <line x1="648" y1="104" x2="736" y2="104" stroke="#34D399" stroke-width="2" />
        <line x1="636" y1="142" x2="800" y2="142" stroke="#284A3E" stroke-width="1" />
        <line x1="626" y1="173" x2="790" y2="173" stroke="#213D33" stroke-width="1" />
        <rect x="652" y="120" width="38" height="4" rx="2" fill="#34D399" fill-opacity="0.85" />
        <rect x="642" y="154" width="92" height="4" rx="2" fill="#F0F6FC" fill-opacity="0.22" />
        <rect x="632" y="184" width="64" height="4" rx="2" fill="#10B981" fill-opacity="0.5" />
      </g>
    </g>

    <!-- Left editorial typography with masked reveal transitions -->
    <g clip-path="url(#mask-name)">
      <text x="48" y="106" class="sans rev-name" font-size="52" font-weight="700" fill="#F8FAFC" letter-spacing="-0.032em">Dandi Setiawan</text>
    </g>

    <g clip-path="url(#mask-role)">
      <text x="48" y="148" class="sans rev-role" font-size="19.5" font-weight="500" fill="#CBD5E1" letter-spacing="-0.01em">Software Engineer &amp; AI Developer</text>
    </g>

    <line class="rule-draw" x1="48" y1="168" x2="468" y2="168" stroke="#1E2D29" stroke-width="1" />

    <!-- Integrated rotating specialty focus inside hero -->
    <rect x="48" y="185" width="6" height="10" rx="1.5" fill="#10B981" />
    <g clip-path="url(#mask-rotator)">
      <text x="64" y="195" class="mono rot-1" font-size="13.5" font-weight="500" fill="#34D399">Full Stack Engineering</text>
      <text x="64" y="195" class="mono rot-2" font-size="13.5" font-weight="500" fill="#34D399">Artificial Intelligence</text>
      <text x="64" y="195" class="mono rot-3" font-size="13.5" font-weight="500" fill="#34D399">AI Agents &amp; Automation</text>
      <text x="64" y="195" class="mono rot-4" font-size="13.5" font-weight="500" fill="#34D399">Software Architecture</text>
    </g>

    <!-- Synchronized progress indicator under rotating specialty -->
    <rect x="48" y="213" width="168" height="2" rx="1" fill="#1A2824" />
    <rect class="prog-fill" x="48" y="213" width="168" height="2" rx="1" fill="#10B981" />

    <g clip-path="url(#mask-loc)">
      <text x="48" y="252" class="sans rev-loc" font-size="13.5" font-weight="400" fill="#94A3B8" letter-spacing="0.01em">Bandar Lampung, Indonesia</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="302.5" rx="14" fill="none" stroke="#22332D" stroke-width="1.2" />
</svg>
