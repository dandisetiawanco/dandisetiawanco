<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 248" width="900" height="248" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Dandi Setiawan, Software Engineer &amp; AI Developer, Bandar Lampung, Indonesia</title>
  <desc id="hero-desc">Editorial personal portfolio header for Dandi Setiawan featuring restrained typography, subtle emerald accent motion, and obsidian tonal depth.</desc>
  <defs>
    <linearGradient id="hero-surface" x1="0" y1="0" x2="900" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="58%" stop-color="#0E1513" />
      <stop offset="100%" stop-color="#101A17" />
    </linearGradient>
    <radialGradient id="ambient-emerald" cx="720" cy="84" r="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.085" />
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.025" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="top-edge-sheen" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rule-sheen" x1="0" y1="0" x2="140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    <clipPath id="hero-clip">
      <rect x="0.75" y="0.75" width="898.5" height="246.5" rx="12" />
    </clipPath>
    <clipPath id="rule-clip">
      <rect x="56" y="160" width="788" height="6" />
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    .edge-sheen, .rule-pass {
      opacity: 0;
    }
    .accent-bar {
      transform-origin: 56px 163px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .t-name {
        animation: riseIn 0.72s cubic-bezier(0.16, 1, 0.3, 1) 0.04s both;
      }
      .t-role {
        animation: riseIn 0.72s cubic-bezier(0.16, 1, 0.3, 1) 0.14s both;
      }
      .accent-bar {
        animation: drawRule 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both;
      }
      .t-loc {
        animation: riseIn 0.72s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both;
      }
      .ambient-plane {
        animation: ambientShift 14s ease-in-out infinite;
      }
      .edge-sheen {
        animation: topGlide 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .rule-pass {
        animation: ruleGlide 12s cubic-bezier(0.4, 0, 0.2, 1) 1.5s infinite;
      }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes drawRule {
      from {
        opacity: 0;
        transform: scaleX(0.15);
      }
      to {
        opacity: 1;
        transform: scaleX(1);
      }
    }
    @keyframes ambientShift {
      0%, 100% {
        transform: translate(0px, 0px);
        opacity: 0.9;
      }
      50% {
        transform: translate(-36px, 12px);
        opacity: 1;
      }
    }
    @keyframes topGlide {
      0% {
        transform: translateX(-260px);
        opacity: 0;
      }
      15% {
        opacity: 0.85;
      }
      75% {
        opacity: 0.85;
      }
      92%, 100% {
        transform: translateX(920px);
        opacity: 0;
      }
    }
    @keyframes ruleGlide {
      0% {
        transform: translateX(-90px);
        opacity: 0;
      }
      12% {
        opacity: 0.75;
      }
      72% {
        opacity: 0.75;
      }
      88%, 100% {
        transform: translateX(860px);
        opacity: 0;
      }
    }
  </style>

  <g clip-path="url(#hero-clip)">
    <rect x="0" y="0" width="900" height="248" fill="url(#hero-surface)" />
    <rect class="ambient-plane" x="-60" y="-30" width="1020" height="308" fill="url(#ambient-emerald)" />

    <line x1="56" y1="1.25" x2="844" y2="1.25" stroke="#182621" stroke-width="1" />
    <rect class="edge-sheen" x="0" y="0.75" width="260" height="1.25" fill="url(#top-edge-sheen)" />

    <text x="56" y="100" class="sans t-name" font-size="48" font-weight="700" fill="#F0F6FC" letter-spacing="-0.03em">Dandi Setiawan</text>

    <text x="56" y="138" class="sans t-role" font-size="19.5" font-weight="500" fill="#D1D5DB" letter-spacing="-0.01em">Software Engineer &amp; AI Developer</text>

    <line x1="56" y1="163" x2="844" y2="163" stroke="#24352E" stroke-width="1" />
    <g clip-path="url(#rule-clip)">
      <rect class="rule-pass" x="56" y="162.25" width="140" height="1.5" fill="url(#rule-sheen)" />
    </g>
    <rect class="accent-bar" x="56" y="162" width="72" height="2" rx="1" fill="#10B981" />

    <text x="56" y="191" class="sans t-loc" font-size="14" font-weight="400" fill="#9CA3AF" letter-spacing="0.01em">Bandar Lampung, Indonesia</text>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="246.5" rx="12" fill="none" stroke="#24352E" stroke-width="1.2" />
</svg>
